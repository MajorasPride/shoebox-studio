<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story Shelf</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"><style id="css">:root{--bg:#f7f5ec;--card:#fffefa;--ink:#2b2b28;--mut:#6d6b62;--line:#2b2b28;--soft:#e4e1d3;--g:#9ccc3c;--gd:#4f7a1f;--gl:#eaf5d3;--red:#b3402b;--hand:'Patrick Hand',cursive}
@media (prefers-color-scheme:dark){:root{--bg:#1c1d1a;--card:#262723;--ink:#ecebe4;--mut:#a5a397;--line:#8d8b80;--soft:#3a3b35;--gl:#2f3a1f;--gd:#a9d65b;--red:#ff8a73}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.brand,.bigq,.tabs button,.beatn,.pnum{font-family:var(--hand);font-weight:400}
h2{font-size:24px;margin:0 0 6px}h3{font-size:21px;margin:4px 0}
a{color:var(--gd);text-decoration:underline;cursor:pointer}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg);border-bottom:2px solid var(--line)}
.brand{font-size:26px;flex:1;background:linear-gradient(transparent 55%,var(--g) 55%,var(--g) 90%,transparent 90%);width:max-content;flex:none;color:#2b2b28}
@media (prefers-color-scheme:dark){.brand{color:var(--ink);background:none;border-bottom:4px solid var(--g)}}
.proj{flex:1;text-align:right;border:none!important;background:none!important;font-weight:700;overflow:hidden;white-space:nowrap}
.cloud{font-size:18px;padding:6px 10px!important}.cloud.dirty{border-color:var(--g)!important;background:var(--gl)!important}
.status{font-size:13px;color:var(--mut);padding:4px 14px}
main{padding:6px 12px 96px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px 10px 16px 9px;padding:14px;margin:12px 0}
.card.tap{cursor:pointer}.card.tap:active{background:var(--gl)}
.intro{font-size:14px;background:var(--gl)}
.endcard{border-color:var(--gd);box-shadow:4px 4px 0 var(--g)}
.lbl{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:9px 10px}
textarea{resize:vertical}input:focus,select:focus,textarea:focus{outline:3px solid var(--g);outline-offset:1px}
button{font:inherit;font-weight:700;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px 8px 11px 8px;padding:9px 12px;cursor:pointer;min-height:42px}
button:active{transform:translate(1px,1px)}
button.primary{background:var(--g);color:#1d2a08;border-color:var(--line)}
button.danger{color:var(--red);border-color:var(--red)}
button.claude{display:none;background:var(--soft);border-style:dashed;width:100%;margin-top:8px}
body.has-claude button.claude{display:block}
.row button.claude{width:auto;margin-top:0}body.has-claude .row button.claude{display:inline-block}
button.claude,body.has-claude button.claude,body.has-claude .row button.claude{display:none!important}
#cloudbtn{display:none!important}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 auto}.row input{flex:1 1 60%}
.row.small button{font-size:14px;padding:6px 8px;min-height:36px}
.card>button{width:100%;margin-top:10px}
.hint{color:var(--mut);font-size:14px;margin:4px 0}.center{text-align:center}
.prow{padding:9px 10px;border:1.5px solid var(--soft);border-radius:10px;margin:6px 0;cursor:pointer;display:flex;flex-direction:column}
.prow.on{border-color:var(--gd);background:var(--gl)}.prow span{font-size:14px;color:var(--mut)}
.note{border-top:1.5px dashed var(--soft);padding:10px 0}.note b{display:block;margin:4px 0}
.ntop{display:flex;gap:6px;align-items:center}
.tag{display:inline-block;font-size:12px;font-weight:700;background:var(--gl);color:var(--gd);border-radius:20px;padding:2px 9px}.tag.alt{background:var(--soft);color:var(--ink)}
.x{margin-left:auto;min-height:30px;padding:0 10px;border-width:1.5px;font-size:18px;line-height:1}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs button{flex:1;border:none;border-radius:0;background:none;font-size:15px;padding:6px 0;display:flex;flex-direction:column;align-items:center;min-height:56px;color:var(--mut)}
.tabs button span{font-size:20px}.tabs button.on{color:var(--ink);background:var(--gl);box-shadow:inset 0 3px 0 var(--g)}
.mtn{width:100%;display:block;margin-top:6px}.mline{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.mlab{font-family:var(--hand);font-size:13px;fill:var(--mut)}
.dot circle{fill:var(--card);stroke:var(--ink);stroke-width:2}.dot.done circle{fill:var(--gl)}.dot.sel circle{fill:var(--g);stroke-width:3}
.dot text{font-family:var(--hand);font-size:15px;text-anchor:middle;fill:var(--ink)}.dot.sel text{fill:#1d2a08}.dot{cursor:pointer}
.endline{font-size:14px;margin-top:8px;padding:6px 10px;background:var(--gl);border-radius:8px}
.beatn{color:var(--gd);font-size:18px}.q{font-size:16px;background:var(--bg);border-left:4px solid var(--g);padding:8px 10px;margin:6px 0 10px}
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:6px;position:relative}
.pnum{position:absolute;top:2px;left:8px;font-size:18px;z-index:1;color:#2b2b28;background:#ffffffcc;padding:0 5px;border-radius:6px}
.pimg{aspect-ratio:4/3;background:#fff;border:1.5px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;color:#888;font-size:14px}
.pimg img{width:100%;height:100%;object-fit:cover}
.panel textarea{margin-top:6px;font-size:14px;padding:6px}
.pbtns{display:flex;gap:4px;margin-top:4px}.pbtns button{flex:1;min-height:34px;padding:2px}
.web{width:100%;aspect-ratio:360/320;background:var(--bg);border:1.5px dashed var(--line);border-radius:10px;touch-action:none;margin-top:10px;display:block;user-select:none}
.node{cursor:grab}.node circle{stroke:var(--ink);stroke-width:2}.node.sel circle{stroke:var(--g);stroke-width:5}
.nic{text-anchor:middle;font-size:16px;pointer-events:none}.nlab{text-anchor:middle;font-family:var(--hand);font-size:14px;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.lnk{stroke:var(--mut);stroke-width:2;stroke-dasharray:5 4}.llab{text-anchor:middle;font-size:10px;fill:var(--gd);font-weight:700;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;border:1px solid var(--line)}
.banner{background:var(--g);color:#1d2a08;padding:8px 10px;border-radius:8px;margin-top:10px;font-size:14px}.banner a{color:#1d2a08}
.lrow{display:flex;gap:6px;align-items:center;margin:6px 0}.lrow span{flex:0 0 38%;font-size:14px}.lrow input{padding:6px 8px;font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;margin:0 -12px;padding-left:12px;padding-right:12px;scrollbar-width:none}
.chip{flex:none;font-size:14px;padding:6px 12px;min-height:36px;border-radius:20px;border-width:1.5px;white-space:nowrap}.chip.on{background:var(--g);color:#1d2a08}
.qmeta{font-size:13px;color:var(--mut)}.bigq{font-size:27px;line-height:1.25;margin:10px 0 6px}.bigq.small{font-size:22px}
.qcard{border-width:3px;box-shadow:5px 5px 0 var(--g)}
.libout{font-size:18px;line-height:1.7;background:var(--gl);border-radius:10px;padding:12px;margin-top:12px}
mark{background:var(--g);color:#1d2a08;padding:0 4px;border-radius:4px}
.motif{font-weight:700;color:var(--gd)}.tale h3{margin:0}
.idea dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px;margin:8px 0}.idea dt{font-weight:700;color:var(--mut)}.idea dd{margin:0}
.sect{margin:20px 4px 0}
.modal{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}.modal[hidden]{display:none}
.mbox{background:var(--card);color:var(--ink);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;border:2px solid var(--line);padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
.mbox canvas{width:100%;aspect-ratio:4/3;border:2px solid var(--line);border-radius:8px;touch-action:none;background:#fff;display:block}
.tools .sw{flex:0 0 38px;min-height:38px;border-radius:50%;padding:0}.tools .sw.on{outline:3px solid var(--g);outline-offset:2px}.tools .er.on{background:var(--gl)}
.clout{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:12px;min-height:80px;font-size:15px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.row button[aria-label="Random"]{flex:0 0 52px}
.seg{display:flex;gap:0;margin-top:10px;border:2px solid var(--line);border-radius:12px;overflow:hidden}.seg button{flex:1;border:none;border-radius:0;font-size:15px}.seg button.on{background:var(--g);color:#1d2a08}
.fq{display:block;width:100%;text-align:left;margin-top:8px;font-weight:600}
.follow{border-style:dashed;border-color:var(--gd)}
.recipe div{padding:8px 0;border-bottom:1.5px dashed var(--soft)}.recipe span{display:block;font-size:12px;font-weight:700;color:var(--gd);text-transform:uppercase;letter-spacing:.05em}
.tag.warn{background:#fdecc8;color:#7a4b00}
.stuck{font-size:14px;padding:6px 8px!important;min-height:36px}
.spark{border-color:var(--gd);box-shadow:4px 4px 0 var(--g)}
.tell{padding:8px 0;border-bottom:1.5px dashed var(--soft);font-size:17px}.tell span{display:block;font-family:var(--hand);font-size:19px;color:var(--gd)}
.proj{min-width:0}
@media (max-width:420px){.brand{font-size:22px}.proj{font-size:14px}}
.skhold canvas{width:100%;display:block;border:2px solid var(--line);border-radius:8px;touch-action:none;background:#fff;margin-top:10px}
.skhold.p canvas{max-height:70vh;width:auto;max-width:100%;margin-left:auto;margin-right:auto;aspect-ratio:2/3}
.sname{flex:1;font-size:13px;align-self:center;overflow:hidden;white-space:nowrap}
.case .cbody{display:none}.case.open .cbody{display:block}.case>div:first-child{cursor:pointer}
.mini{float:right;font-size:13px;min-height:32px;padding:4px 8px;margin:0 0 6px 8px}
.fq.right{background:var(--gl);border-color:var(--gd)}.fq.wrong{border-color:var(--red);color:var(--red)}.fq:disabled{opacity:1}
.why{margin-top:10px;padding:10px;border-radius:10px;font-size:15px}.why.ok{background:var(--gl)}.why.no{background:var(--soft)}

.tabs button{font-size:13px}.tabs button span{font-size:19px}
.node rect.bx{stroke:var(--ink);stroke-width:2}.node.sel rect.bx{stroke:var(--g);stroke-width:5}
.goal{border-left:8px solid var(--soft);padding:2px 0 8px 10px;margin:10px 0}.goal input,.goal select{margin-top:6px;font-size:15px;padding:7px 9px}
.grow{display:flex;gap:6px;align-items:center}.grow input{flex:1;margin-top:0}
.sw2{flex:0 0 34px;min-height:34px;border-radius:50%;padding:0}

.lblock{border-bottom:1.5px dashed var(--soft);padding-bottom:8px;margin-bottom:8px}.lblock select{font-size:14px;padding:6px 8px}
.sthold{overflow-x:auto;border:1.5px dashed var(--line);border-radius:10px;background:var(--bg);margin-top:8px}
#staff{display:block;user-select:none}
.stn{font-size:10px;fill:var(--mut);text-anchor:middle}.stname{font-family:var(--hand);font-size:14px;fill:var(--ink)}
.stmark{stroke:var(--ink);stroke-width:2.5}.stmlab{font-family:var(--hand);font-size:13px;fill:var(--ink)}
.bt{cursor:pointer}.bt circle,.bt rect{stroke:var(--ink);stroke-width:2}.bt.sel circle,.bt.sel rect{stroke:var(--g);stroke-width:5}
.bti{text-anchor:middle;font-size:14px;pointer-events:none}.btl{text-anchor:middle;font-size:10px;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.stslot{fill:none;stroke:var(--gd);stroke-width:2;stroke-dasharray:4 3}
.tgl{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.tgl .chip{min-height:34px;padding:4px 11px}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.kinds button{text-align:left;font-size:14px}
.chk{padding:7px 0;border-bottom:1.5px dashed var(--soft);font-size:15px}.chk:last-child{border:none}
.pat{border-bottom:1.5px dashed var(--soft);padding:10px 0}.pat:last-of-type{border:none}.pat b{font-family:var(--hand);font-size:20px;font-weight:400;display:block}.pat .q{margin:8px 0 0}
.src{font-size:13px;color:var(--mut)}.src a{display:block;margin-top:4px}
.tabs button{min-width:0}@media(max-width:420px){.tabs button{font-size:12px}.tabs button span{font-size:18px}}
.tband{fill:var(--gl);opacity:.6}.tdyn{font-family:var(--hand);font-size:12px;fill:var(--mut)}
.bt.dim{opacity:.2}
#ptree{display:block;user-select:none}
.pn{cursor:pointer}.pn rect{stroke:var(--ink);stroke-width:2}.pn.sel rect{stroke:var(--g);stroke-width:5}
.pt1{text-anchor:middle;font-family:var(--hand);font-size:15px;pointer-events:none}.pt2{text-anchor:middle;font-size:10px;pointer-events:none}
.pt1,.pt2{fill:var(--ink)}.pc .pt1,.pc .pt2{fill:#2b2b28}
.plab{text-anchor:middle;font-size:10px;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;pointer-events:none}
svg.mini{max-width:100%;height:auto;margin:8px auto;display:block}
.walk h2{margin-top:4px}.walktxt{font-size:17px;line-height:1.5}
.walkopts{display:flex;flex-direction:column;gap:8px;margin-top:10px}.walkopts button{text-align:left;font-size:16px}.walkopts button small{display:block;color:var(--mut);font-size:12px}

.tickl{display:flex;gap:6px;align-items:center;margin-top:6px}.tickl input{width:auto;margin:0}
.pimg{position:relative}.bdmini{position:absolute;inset:0}.bdhint{position:relative;z-index:1;background:#ffffffcc;padding:2px 6px;border-radius:6px}
.modal.dark .mbox{background:#0e0d0c;color:#e9e2d6;border-color:#2c2925}
.player{font-family:Georgia,"Times New Roman",serif}.plhead{display:flex;justify-content:space-between;gap:8px;font:13px system-ui,sans-serif;color:#8c8377;margin-bottom:8px}.plhead b{color:#e9e2d6;font-weight:600}

.plbody{background:#1a1816;border:1px solid #2c2925;border-top:none;border-radius:0 0 6px 6px;padding:12px 14px}
.pltitle{font-size:18px}.plmeta{font:12px system-ui,sans-serif;color:#8c8377;margin:3px 0 8px}.plcap{font-size:15px;line-height:1.5;margin:0 0 10px}.plcam{font:13px system-ui,sans-serif;color:#8c8377;margin:0 0 8px}
.plworld{font:13px system-ui,sans-serif;border-top:1px solid #2c2925;padding-top:8px;color:#b9ad9b}.plworld b{color:#c9a24a}
.plctl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}.plctl button,.plclose{background:#221f1c;color:#e9e2d6;border:1px solid #3a342e}.plctl button:disabled{opacity:.35}
.plclose{width:100%;margin-top:10px}

.shot{position:absolute;inset:0}

.bd-room{background:radial-gradient(ellipse at 50% 40%,#3b2f24 0%,#15110e 70%)}.blob{position:absolute;width:15%;aspect-ratio:1;border-radius:50%;background:#6b5a48}
.bd-wall{background:linear-gradient(#2c2620,#1a1613)}.tbl{position:absolute;left:20%;bottom:30%;width:60%;height:5%;background:#4a3d31}
.scr{position:absolute;left:38%;top:22%;width:24%;height:40%;background:#7fb0c6;box-shadow:0 0 30px #7fb0c655}
.emp{position:absolute;left:55%;bottom:20%;width:18%;height:24%;background:#241f1b;border:1px dashed #5a5045}
.bd-car{background:linear-gradient(#0c0c0c,#111)}.seat{position:absolute;left:20%;right:20%;bottom:18%;height:44%;background:#26211d;border-radius:8px 8px 2px 2px}
.bd-road{background:linear-gradient(#05070c 55%,#111 55%)}.rd{position:absolute;left:30%;right:30%;bottom:0;height:45%;background:linear-gradient(90deg,transparent 48%,#c9a24a55 48% 52%,transparent 52%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);background-color:#1b1b1b}.lamp{position:absolute;left:18%;top:20%;width:2%;height:36%;background:#333;box-shadow:0 0 40px 16px #c9a24a22}

.bd-sky{background:radial-gradient(circle at 70% 25%,#1c2333,#05070c 60%)}.moon{position:absolute;right:18%;top:12%;width:16%;aspect-ratio:1;border-radius:50%;background:#e9e2d6;box-shadow:0 0 40px #e9e2d655}

.subnav{position:sticky;top:0;z-index:4;background:var(--bg)}
.tok{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid var(--ink);overflow:hidden;flex:none;font-family:var(--hand);color:#2b2b28;vertical-align:middle}.tok img{width:100%;height:100%;object-fit:cover}
.tki{text-anchor:middle;font-family:var(--hand);fill:#2b2b28;pointer-events:none}.tk{cursor:pointer}.tk.sel circle:last-of-type{stroke:var(--g);stroke-width:5}

['Theseus and the Minotaur','Greece','A hero escapes a labyrinth using a thread, kills the monster — then forgets to change his ship\'s sail, and his father dies of grief thinking he lost.','Victory ruined by a small mistake','What tiny forgotten thing could turn your hero\'s win into a tragedy?'],
['Oedipus','Greece, Sophocles','A man hears a terrible prophecy about himself and runs away to avoid it — and running away is exactly what makes it come true.','Running from fate creates fate','How does trying to avoid the future cause it in your story?'],
['Eden','Hebrew Bible, Genesis','The first humans live in a perfect garden with one forbidden tree. They eat its fruit, gain knowledge, and are sent out into the hard world.','Knowledge costs paradise','What knowledge costs your characters their safe, simple life?'],
['Cain and Abel','Hebrew Bible, Genesis','Jealous of his brother, Cain kills him. He is exiled with a mark that both shames him and protects him from being killed.','The mark that protects and brands','What mark does your character carry that protects them AND shames them?'],
['The Flood','Mesopotamia & Genesis','The world is wiped out by a flood. One family builds a great boat and saves life to start again. The older Mesopotamian version has a survivor named Utnapishtim.','The world reset','Who survived your world\'s last ending, and what did they bring with them?'],
['Tower of Babel','Hebrew Bible, Genesis','Humanity builds a tower to reach heaven. Their language is split into many, and they scatter across the earth.','The great project that divides','What great project once united your world — and what broke it apart?'],
['Joseph and his brothers','Hebrew Bible, Genesis','Sold as a slave by jealous brothers, Joseph rises to rule beside Pharaoh. Years later his starving brothers come begging, not knowing who he is.','Power over those who betrayed you','What does your character do when the people who betrayed them need their help?'],
['Exodus','Hebrew Bible','Raised in the palace of the enemy, Moses leads his people out of slavery through plagues and a parted sea — but never gets to enter the promised land himself.','The leader who can\'t finish the journey','What does your leader sacrifice so others can reach the goal?'],
['Job','Hebrew Bible','A good man loses his family, wealth and health as a test. He argues with God and demands answers.','Faith under total loss','How does your character keep — or lose — faith when everything is taken?'],
['Jonah','Hebrew Bible','A prophet runs from his mission, gets swallowed by a great fish, finally delivers the warning — and is angry when the city is spared.','Succeeding and hating it','What if your hero wins and hates the result?'],
['David and Goliath','Hebrew Bible','A shepherd boy beats a giant warrior with a sling and a stone.','The small skill that beats the giant','What "small" everyday skill could beat your story\'s giant?'],
['Samson','Hebrew Bible','A man\'s great strength comes from his uncut hair. The woman he loves is paid to learn his secret.','The secret source of power','What is the secret source of your hero\'s power, and who would sell it?'],
['Revelation','Christian Bible','Visions of seals breaking, four horsemen, beasts and a final battle — followed by a new heaven and earth.','Signs of the end','What signs show your world is ending — and who can read them?'],
['Ragnarök','Norse','The gods know the end of the world is coming and exactly how they will die. They fight anyway. A new world rises after.','Fighting a fight you know you\'ll lose','What does your character do when they know they\'ll lose?'],
['The death of Baldr','Norse','Every thing in the world promises not to harm the beloved god Baldr — except mistletoe, which seemed too small to ask. Loki uses it to kill him.','The one overlooked weakness','What tiny overlooked thing could kill your "invincible" character?'],

['Izanagi and Izanami','Japan, Kojiki','The creator gods make Japan. Izanami dies; Izanagi follows her to the land of the dead but breaks his promise not to look at her. She curses him and he flees, sealing the door.','Love that breaks a promise','What happens when love makes someone break the one promise that mattered?'],
['Amaterasu and the cave','Japan, Kojiki','After her brother\'s rampage, the sun goddess hides in a cave and the world goes dark. The gods throw a loud party and use a mirror to lure her out.','Coaxing a hidden power out','How do people bring a hiding power — or person — back into the world?'],
['Susanoo and Orochi','Japan, Kojiki','The exiled storm god gets an eight-headed serpent drunk on sake and slays it, finding a legendary sword in its tail.','The disgraced hero redeemed by cleverness','How does your disgraced character win with a trick instead of strength?'],
['Urashima Tarō','Japan, folktale','A fisherman saves a turtle and visits a palace under the sea. When he returns, hundreds of years have passed. He opens the box he was told never to open.','Away too long','What does your character lose by being gone too long?'],
['Momotarō','Japan, folktale','A boy born from a peach shares his dumplings with a dog, a monkey and a pheasant, and together they defeat the oni of Demon Island.','Weird allies earned by kindness','What strange allies does your hero earn by sharing?'],

['Ramayana','India','An exiled prince\'s wife is kidnapped by a demon king. He wins her back with an army of monkeys led by Hanuman.','The unexpected army','Who is the unexpected army that shows up for your hero?'],
['One Thousand and One Nights','Middle East','Scheherazade avoids execution by telling the king a story every night and stopping at the cliffhanger.','The story that keeps you alive','What story, lie or secret keeps your character alive?'],
['Beowulf','Old English','A hero kills the monster Grendel, then its mother. Fifty years later, as an old king, he fights a dragon and dies.','The last fight, decades later','What is your hero\'s final fight when they\'re old?'],
['King Arthur','Britain, medieval','A boy pulls a sword from a stone and builds a perfect round table — destroyed by his best knight\'s betrayal and his own son.','The perfect kingdom broken from inside','What perfect thing do your heroes build — and which friendship breaks it?'],
['Osiris','Egypt','A god-king is murdered by his jealous brother and his body scattered. His wife Isis gathers the pieces; their son Horus takes revenge.','Gathering the scattered pieces','What has been scattered that must be gathered again?'],
['Inanna\'s descent','Sumer','A goddess goes into the underworld. At each of seven gates she must give up a piece of her power. She dies, is revived — and someone must take her place.','Losing a piece at every gate','What does your character have to give up at each step?'],
['Anansi buys the stories','West Africa / Caribbean','The small spider Anansi wins all the world\'s stories from the sky god by capturing creatures everyone said were impossible to catch.','The trickster wins what the mighty can\'t','How does a small, clever character get what the powerful won\'t give?'],
['The Hero Twins','Maya, Popol Vuh','Twin brothers are summoned to the underworld, survive deadly houses and beat the lords of death at their own rigged ballgame. They rise as the sun and moon.','Beating a rigged game','What rigged game must your heroes beat, and how?'],

['Frankenstein','Mary Shelley, 1818','A scientist builds a living creature, then abandons it in horror. Rejected by everyone, the creature turns on him.','The creator who walks away','Who made your monster — and why did they abandon it?'],
['Dante\'s Inferno','Italy, ~1320','A poet travels down nine circles of hell where each punishment matches the sin.','Punishment that fits the flaw','Design a place where each level punishes a different flaw.'],
['Bluebeard','France, folktale','A new wife is given every key in the castle and told never to open one small room. She opens it.','The forbidden room','What room, file or box is your character told never to open?'],
['Rumpelstiltskin','Germany, folktale','A strange little man spins straw into gold for a price — her firstborn child — unless she can guess his name.','The power of a true name','What power do true names have in your world?'],
['The Pied Piper','Germany, legend','A town refuses to pay the piper who rid them of rats. He plays a new tune and leads their children away.','The unpaid debt','What happens when your town refuses to pay what it owes?']];

{k:'premise',g:'core',i:'💡',n:'Premise and logline',w:'The idea in one sentence: who, what they want, what stands in the way, what is at risk. The pitch you could say in an elevator.',q:[['Who is it about? (one detail that makes them different)','A small mouse who lights every lantern in a hedge village'],['What do they want?','To keep the village lit all winter'],['What stands in the way?','The oil runs out, and the winter is the longest ever'],['What happens if they fail — or succeed too well?','The village sits in the dark — or she hurts the fireflies to stop it']],link:['home','Home → pitch']},
{k:'core3',g:'core',i:'🎯',n:'Character + goal + obstacle',w:'Every main character needs a goal and something blocking it. No goal = nothing to root for. No obstacle = no story.',q:[['Main character\'s goal right now','Find more light before tonight'],['The outside obstacle (a person, place, thing)','The oil barrel is empty and the shop is snowed in'],['The inside obstacle (fear, flaw, belief)','She thinks the dark is her fault'],['What they want vs what they need','Wants every lantern lit; needs to learn the dark is not a failure']],link:['web','People → Web']},

{k:'theme',g:'core',i:'🌱',n:'Theme',w:'What the story is really about underneath — a question it explores, not a lecture. Show it through choices, don\'t say it.',q:[['The question your story asks','Do you have to fix the dark by yourself?'],['Who answers it one way, who the other way?','Pip: "I have to." The fireflies: "Nobody can."'],['The moment that answers it','The whole village sits together under the stars']],link:['staff','Story → Staff themes']},

function blank(name,medium){return{id:uid(),name:name||'Untitled story',medium:medium||'Book',created:Date.now(),logline:'',ending:'',opening:'',tmpl:'six',back:false,beats:{},board:[],web:{nodes:[],links:[]},notes:[],sheets:[]}}
function loadState(){
 let emb=null,loc=null;
 try{emb=JSON.parse(document.getElementById('state').textContent)}catch(e){}
 try{loc=JSON.parse(localStorage.getItem(LS))}catch(e){}
 S=[emb,loc].filter(x=>x&&Array.isArray(x.projects)).sort((a,b)=>(b.updated||0)-(a.updated||0))[0]||{v:1,updated:0,synced:0,cur:null,projects:[]};
 if(!S.projects.length){const p=blank('My first story','Book');S.projects.push(p);S.cur=p.id}
 if(!cur())S.cur=S.projects[0].id;
}
function cur(){return S.projects.find(p=>p.id===S.cur)}
function save(){S.updated=Date.now();clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}},300);renderStatus()}
function setP(k,v){cur()[k]=v;save()}
function renderStatus(){const el=$('#status');if(!el)return;const dirty=!S.synced||(S.updated||0)>(S.synced||0);
 el.innerHTML=dirty?(ART?'Saved on this phone · <a onclick="cloudSave()">tap to save to cloud ☁️</a>':'Saved on this phone'):'☁️ Saved to cloud '+(S.synced?new Date(S.synced).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'');
 const b=$('#cloudbtn');if(b)b.classList.toggle('dirty',dirty);}

function buildHTML(){
 const css=document.getElementById('css').textContent,data=document.getElementById('data').textContent,app=document.getElementById('app').textContent;
 const json=JSON.stringify(S).replace(/</g,'\\u003c');
 return '<!DOCTYPE html>\n<html lang="en"><head>'+HEAD+'<style id="css">'+css+'</style></head><body><div id="root"></div><script id="state" type="application/json">'+json+'<\/script><script id="data">'+data+'<\/script><script id="app">'+app+'<\/script></body></html>';
}
async function cloudSave(){
 if(!ART){toast('Cloud save isn\'t available here — your work is still saved on this phone.');return}
 const prev=S.synced;S.synced=Date.now();S.updated=S.synced;
 try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
 toast('Saving to cloud…');
 try{await ART.publish(buildHTML())}catch(e){S.synced=prev;
  if(e&&e.code==='conflict')toast('Another copy saved first — the page will reload.');
  else if(e&&(e.code==='not_granted'||e.code==='not_writer'))toast('This copy is read-only.');
  else toast('Couldn\'t save to cloud. Your work is still on this phone.');renderStatus()}
}

<section class="card endcard">

 <label class="lbl">The opening — how does it echo the ending?</label><textarea rows="2" oninput="setP('opening',this.value)" placeholder="She lights the lamp for the first time, terrified.">${esc(p.opening)}</textarea>

</section>
<section class="card"><h2>Your projects</h2>${S.projects.map(x=>`<div class="prow ${x.id===p.id?'on':''}" onclick="switchP('${x.id}')"><b>${esc(x.name)}</b><span>${esc(x.medium)} · ${x.notes.length} notes · ${x.web.nodes.length} ideas · ${x.board.length} panels</span></div>`).join('')}
 <div class="row"><button onclick="newP()">＋ New project</button><button onclick="copyAll()">📋 Copy as text</button></div>
 <div class="row"><button class="danger" onclick="delP()">Delete this project</button></div></section>
<section class="card"><h2>Notes and answers (${p.notes.length})</h2>${notesHTML(p)}</section>
<section class="card"><h2>Saved worksheets (${p.sheets.length})</h2>${p.sheets.map((s,i)=>`<div class="prow" onclick="openSaved(${i})"><b>${esc(s.title||'Untitled')}</b><span>${esc(SHEETS[s.type]?SHEETS[s.type].n:'')}</span></div>`).join('')||'<p class="hint">Fill one in from Tools → Worksheets.</p>'}</section>
<section class="card"><h2>Saving</h2><p class="hint">Everything saves on this phone as you type. Tap ☁️ to save it into the page itself, so it's there on any device.</p><button onclick="cloudSave()">☁️ Save to cloud</button></section>`};
function notesHTML(p){if(!p.notes.length)return '<p class="hint">Answers from Cards and Tools land here.</p>';
 return p.notes.slice().reverse().map(n=>`<div class="note"><div class="ntop"><span class="tag">${esc(n.deck)}</span>${n.about?`<span class="tag alt">${esc(n.about)}</span>`:''}<button class="x" onclick="delNote('${n.id}')" aria-label="Delete">×</button></div><b>${esc(n.q)}</b><textarea rows="3" oninput="editNote('${n.id}',this.value)">${esc(n.a)}</textarea></div>`).join('')}
function saveNote(q,a,deck,about){if(!String(a||'').trim()){toast('Write an answer first');return false}cur().notes.push({id:uid(),q,a,deck:deck||'Note',about:about||'',ts:Date.now()});save();toast('Saved to notes');return true}
function editNote(id,v){const n=cur().notes.find(x=>x.id===id);if(n){n.a=v;save()}}
function delNote(id){const p=cur();p.notes=p.notes.filter(x=>x.id!==id);save();render()}
function switchP(id){S.cur=id;SEL=null;STB=null;STSLOT=null;ARCSEL=0;save();render()}
function newP(name,medium){openModal(`<h3>New project</h3><label class="lbl">Name</label><input id="npn" value="${esc(name||'')}" placeholder="Working title"><label class="lbl">Medium</label><select id="npm">${MEDIA.map(m=>`<option ${m===medium?'selected':''}>${m}</option>`).join('')}</select><div class="row"><button class="primary" onclick="createP()">Create</button><button onclick="closeModal()">Cancel</button></div>`)}
function createP(){const p=blank($('#npn').value.trim(),$('#npm').value);S.projects.push(p);S.cur=p.id;save();closeModal();go('home')}
function delP(){if(S.projects.length<2){toast('You need at least one project');return}confirmBox('Delete "'+cur().name+'" for good?',()=>{S.projects=S.projects.filter(x=>x.id!==S.cur);S.cur=S.projects[0].id;save();render()})}
function projText(p){let t=`${p.name} (${p.medium})\n\nPITCH: ${p.logline}\nENDING: ${p.ending}\nOPENING: ${p.opening}\n`;
 for(const k in p.beats){const B=p.beats[k];if(!B||!B.some(x=>x))continue;t+=`\n== ${TEMPLATES[k].n} ==\n`;TEMPLATES[k].b.forEach((b,i)=>{if(B[i])t+=`${i+1}. ${b[0]}: ${B[i]}\n`})}
 if(p.web.nodes.length){t+='\n== Idea web ==\n';p.web.nodes.forEach(n=>t+=`- ${n.label} [${NODE_TYPES[n.type].n}]${n.notes?': '+n.notes:''}\n`);p.web.links.forEach(l=>{const a=p.web.nodes.find(n=>n.id===l.a),b=p.web.nodes.find(n=>n.id===l.b);if(a&&b)t+=`  ${a.label} → ${b.label}${l.label?' ('+l.label+')':''}\n`})}
 t+=deepText(p);
 if(p.board.length){t+='\n== Storyboard ==\n';p.board.forEach((b,i)=>t+=`${i+1}. ${b.cap}\n`)}
 if(p.notes.length){t+='\n== Notes ==\n';p.notes.forEach(n=>t+=`[${n.deck}${n.about?' / '+n.about:''}] ${n.q}\n${n.a}\n\n`)}
 p.sheets.forEach(s=>{t+=`\n== Worksheet: ${s.title} (${SHEETS[s.type].n}) ==\n`;SHEETS[s.type].f.forEach((f,i)=>{if(s.vals[i])t+=`${f}: ${s.vals[i]}\n`})});
 return t}
function copyAll(){const t=projText(cur());const fb=()=>openModal(`<h3>Copy your project</h3><textarea rows="14">${esc(t)}</textarea><button onclick="closeModal()">Close</button>`);
 try{navigator.clipboard.writeText(t).then(()=>toast('Copied — paste it anywhere'),fb)}catch(e){fb()}}

/* ---------- SPARK / PUSH ---------- */
function newSpark(){const p=cur(),chars=p.web.nodes.filter(n=>n.type==='character');const s={};for(const k in SPARK)s[k]=pick(SPARK[k]);if(chars.length&&Math.random()<.5)s.who=pick(chars).label;return s}
function sparkText(s){return `You're ${s.where}. You're ${/^[A-Z]/.test(s.who)?s.who:s.who}, ${s.why} — ${s.wrong}.`}
function sparkCard(){if(!SPK)SPK=newSpark();return `<section class="card spark"><h2>🎲 Scene starter</h2><p class="hint">No blank page. Here's a place, a person, a reason and a problem — the "why" behind the story.</p>
<div class="recipe"><div><span>Where</span>${esc(SPK.where)}</div><div><span>Who</span>${esc(SPK.who)}</div><div><span>Why they're here</span>${esc(SPK.why)}</div><div><span>What's wrong</span>${esc(SPK.wrong)}</div></div>
<div class="chips">${['where','who','why','wrong'].map(k=>`<button class="chip" onclick="SPK['${k}']=pick(SPARK['${k}']);render()">🎲 ${k}</button>`).join('')}<button class="chip" onclick="SPK=newSpark();render()">🎲 all</button></div>
<p class="q">What do they do in the next 60 seconds?</p><textarea id="spka" rows="3" placeholder="Just the next move. Small is fine."></textarea>
<div class="row"><button class="primary" onclick="saveNote('Scene: '+sparkText(SPK),$('#spka').value,'Scene starter')">Save</button><button onclick="sparkProject()">Start a project</button></div><button class="claude" onclick="sparkClaude()">✨ Claude, play the scene with me</button></section>`}
function sparkProject(){const t=sparkText(SPK),p=blank('Scene: '+SPK.where.replace(/^(at|in|on) (a |an |the )?/,''),'Short story');p.logline=t;p.opening=$('#spka').value;p.tmpl='short';S.projects.push(p);S.cur=p.id;SPK=null;save();toast('Project made — Arc is set to the short-story shape');go('home')}
function sparkClaude(){askClaude('Play the scene',`Scene: ${sparkText(SPK)} My next move: "${$('#spka').value||'(not written yet)'}". Play the other people in the scene: write what happens next in 4–6 short lines, make it a bit worse for my character, then stop and ask me "What do you do?" Don't write my character's actions.`)}
function pushMe(){openModal(`<h3>😵 Stuck? Try this:</h3><div class="bigq" id="pushq">${esc(pick(PUSH))}</div><div class="row"><button onclick="$('#pushq').textContent=pick(PUSH)">🔀 Another</button><button class="primary" onclick="closeModal()">Got it</button></div><p class="hint">Still stuck? Do a <a onclick="closeModal();CMODE='trails';go('cards')">Question trail</a> or roll a <a onclick="closeModal();SPK=null;go('home')">Scene starter</a>.</p>`)}

/* ---------- TELL IT ---------- */
const JOIN=['So there\'s this…','And one day…','But…','And then…','So…','And in the end…'];
function tellIt(){const p=cur(),T=TEMPLATES[p.tmpl],B=beatsOf(p);const lines=T.b.map((b,i)=>({h:b[0],t:B[i]||''}));
 const glue=i=>T.glue?T.glue[i]:T.b.length===6?JOIN[i]:(i===0?'So there\'s this…':i===T.b.length-1?'And in the end…':pick(['And then…','But…','So…','Which means…']));
 openModal(`<h3>🎤 Tell it out loud</h3><p class="hint">Read it like you're telling a friend. Where it sounds boring or confusing — that's the part to fix.</p>${p.logline?`<p class="q">${esc(p.logline)}</p>`:''}${lines.map((l,i)=>`<div class="tell"><span>${esc(glue(i))}</span>${l.t?esc(l.t):`<i class="hint">(${esc(l.h)} — not written yet)</i>`}</div>`).join('')}<div class="row"><button class="primary" onclick="closeModal()">Done</button></div><button class="claude" onclick="closeModal();askClaude('Tell it back','Retell my story out loud in a casual, spoken way, like a friend telling it at a bar — 150 words max, using only what I wrote. Then tell me the ONE spot that sounds weakest and ask me one question to fix it.')">✨ Claude, tell it back to me</button>`)}

/* ---------- ARC ---------- */
function beatsOf(p){return p.beats[p.tmpl]||(p.beats[p.tmpl]=[])}
function arcOrder(p){const o=[...Array(TEMPLATES[p.tmpl].b.length).keys()];return p.back?o.reverse():o}
function mountain(n,order,sel,B){
 const f=t=>t<.68?Math.pow(t/.68,1.7):1-Math.pow((t-.68)/.32,1.2)*.88;
 const X=t=>22+t*316,Y=t=>152-f(t)*118;let d='';
 for(let i=0;i<=60;i++){const t=i/60;d+=(i?'L':'M')+X(t).toFixed(1)+' '+Y(t).toFixed(1)}
 const dots=order.map((i,k)=>{const t=.03+i/(n-1||1)*.94,x=X(t),y=Y(t);return `<g class="dot ${i===sel?'sel':''} ${B[i]?'done':''}" onclick="ARCSEL=${i};render()"><circle cx="${x}" cy="${y}" r="${i===sel?14:11}"/><text x="${x}" y="${y+5}">${k+1}</text></g>`}).join('');
 return `<svg viewBox="0 0 360 172" class="mtn"><path d="${d}" class="mline"/><text x="300" y="168" class="mlab">end</text><text x="12" y="168" class="mlab">start</text>${dots}</svg>`}
VIEWS.arc=()=>{const p=cur(),T=TEMPLATES[p.tmpl],B=beatsOf(p),n=T.b.length,order=arcOrder(p);if(ARCSEL>=n)ARCSEL=order[0];
 const b=T.b[ARCSEL];let prompt=b[1];
 if(p.back&&ARCSEL<n-1)prompt=`Working backwards: what had to happen here so that "${T.b[ARCSEL+1][0]}" could happen?`+(B[ARCSEL+1]?` (Next step: "${trim(B[ARCSEL+1],90)}")`:'')+' — '+b[1];
 if(p.back&&ARCSEL===n-1)prompt='Start here, at the end. '+b[1]+(p.ending?` Your ending: "${trim(p.ending,90)}"`:'');
 return `<section class="card"><div class="row"><select onchange="setTmpl(this.value)">${Object.entries(TEMPLATES).map(([k,v])=>`<option value="${k}" ${k===p.tmpl?'selected':''}>${v.n}</option>`).join('')}</select><button class="${p.back?'primary':''}" onclick="toggleBack()">${p.back?'⬅️ Backwards':'➡️ Forwards'}</button></div>
 <div class="endline"><b>Ending:</b> ${p.ending?esc(trim(p.ending,140)):'<i>not written yet — <a onclick="go(\'home\')">write it first</a></i>'}</div>
 ${mountain(n,order,ARCSEL,B)}</section>
 <section class="card beat"><div class="beatn">Step ${order.indexOf(ARCSEL)+1} of ${n}</div><h2>${esc(b[0])}</h2><p class="q">${esc(prompt)}</p><textarea rows="5" oninput="setBeat(${ARCSEL},this.value)" placeholder="Write it messy. You can fix it later.">${esc(B[ARCSEL]||'')}</textarea>
 <div class="row"><button onclick="arcStep(-1)">◀ Back</button><button onclick="arcStep(1)">Next ▶</button></div>
 <div class="row"><button onclick="tellIt()">🎤 Tell it</button><button onclick="beatToBoard(${ARCSEL})">🎞️ Add to board</button><button class="claude" onclick="arcClaude()">✨ Ideas for this step</button></div></section>
 <section class="card"><h2>All steps</h2>${order.map((i,k)=>`<div class="prow ${i===ARCSEL?'on':''}" onclick="ARCSEL=${i};render()"><b>${k+1}. ${esc(T.b[i][0])}</b><span>${B[i]?esc(trim(B[i],100)):'—'}</span></div>`).join('')}<button onclick="tellIt()">🎤 Tell the whole story out loud</button><button onclick="arcToBoard()">🎞️ Turn every step into a storyboard panel</button></section>`};
function setTmpl(v){const p=cur();p.tmpl=v;ARCSEL=arcOrder(p)[0];save();render()}
function toggleBack(){const p=cur();p.back=!p.back;ARCSEL=arcOrder(p)[0];save();render()}
function setBeat(i,v){beatsOf(cur())[i]=v;save()}
function arcStep(d){const o=arcOrder(cur()),k=o.indexOf(ARCSEL)+d;if(k<0||k>=o.length){toast(k<0?'This is the first step':'Last step — nice!');return}ARCSEL=o[k];render();window.scrollTo(0,0)}
function beatToBoard(i){const p=cur(),T=TEMPLATES[p.tmpl];p.board.push({id:uid(),cap:T.b[i][0]+': '+(beatsOf(p)[i]||''),img:''});save();toast('Added panel '+p.board.length)}
function arcToBoard(){const p=cur(),T=TEMPLATES[p.tmpl],B=beatsOf(p);T.b.forEach((b,i)=>p.board.push({id:uid(),cap:b[0]+': '+(B[i]||''),img:''}));save();toast(T.b.length+' panels added');go('board')}
function arcClaude(){const p=cur(),T=TEMPLATES[p.tmpl],b=T.b[ARCSEL];askClaude('Ideas: '+b[0],`Story shape: ${T.n}. ${p.back?'The user is working BACKWARDS from the ending, so this step must lead into the step after it.':''} Current step: "${b[0]}" (${b[1]}). Give 3 different short ideas for what could happen in this step that connect to the steps around it and to the ending. Then ask 2 questions that would help the user choose.`)}

/* ---------- BOARD ---------- */
VIEWS.board=()=>{const p=cur();return `<section class="card"><div class="row"><button class="primary" onclick="addPanel()">＋ Panel</button><button onclick="arcToBoard()">⛰️ From arc</button><button onclick="staffToBoard()">🎼 From Staff</button>${p.board.length?'<button onclick="playBoard(0)">▶ Play it</button>':''}</div><p class="hint">Tap a picture box to sketch, or tap 📷 to use a photo from your phone. Open 🎬 Shot on a panel to set the camera, how long it holds and how the world reacts — then ▶ Play it shot by shot, like a game storyboard. No sketch? Pick a quick scene picture.</p></section>
<div class="board">${p.board.map((pn,i)=>`<div class="panel"><div class="pnum">${i+1}</div><div class="pimg" onclick="drawPanel(${i})">${pn.img?`<img src="${pn.img}" alt="Panel ${i+1} sketch">`:pn.bg?`<div class="bdmini">${bdHTML(pn.bg)}</div><span class="bdhint">✏️ tap to sketch</span>`:'<span>✏️ tap to sketch</span>'}</div><textarea rows="3" placeholder="What happens…" oninput="setPanel(${i},this.value)">${esc(pn.cap)}</textarea><details class="shotd" ${pn.st||pn.cam||pn.world||pn.title?'':''}><summary>🎬 Shot${shotMeta(pn)?' · '+esc(shotMeta(pn)):''}</summary>
<input value="${esc(pn.title||'')}" placeholder="Shot name (The Front Door)" oninput="setPanelF(${i},'title',this.value)">
<select onchange="setPanelF(${i},'st',this.value,1)">${opts(SHOT_TYPES,pn.st).replace('>—<','>Camera move…<')}</select>
<input type="number" min="1" inputmode="numeric" value="${esc(pn.sec||'')}" placeholder="How many seconds?" oninput="setPanelF(${i},'sec',this.value)">
<input value="${esc(pn.cam||'')}" placeholder="Camera note (stays on the door, no cut)" oninput="setPanelF(${i},'cam',this.value)">
<textarea rows="2" placeholder="World reacts: if they stay… if they leave…" oninput="setPanelF(${i},'world',this.value)">${esc(pn.world||'')}</textarea>
${pn.img?'':`<select onchange="setPanelF(${i},'bg',this.value,1)"><option value="">Quick scene picture…</option>${Object.entries(BACKDROPS).map(([k,v])=>`<option value="${k}" ${k===pn.bg?'selected':''}>${esc(v)}</option>`).join('')}</select>`}
<label class="tickl"><input type="checkbox" ${pn.fade?'checked':''} onchange="setPanelF(${i},'fade',this.checked)"> Fade to black at the end</label>
<button onclick="playBoard(${i})">▶ Play from here</button></details><div class="pbtns"><button onclick="panelPhoto(${i})" aria-label="Add a photo">📷</button><button onclick="movePanel(${i},-1)" aria-label="Move left">◀</button><button onclick="movePanel(${i},1)" aria-label="Move right">▶</button><button onclick="delPanel(${i})" aria-label="Delete">🗑</button></div></div>`).join('')}</div>${p.board.length?'':'<p class="hint center">No panels yet. Add one, or build them from your Arc.</p>'}`};
function addPanel(){cur().board.push({id:uid(),cap:'',img:''});save();render();window.scrollTo(0,document.body.scrollHeight)}
function setPanel(i,v){cur().board[i].cap=v;save()}
function movePanel(i,d){const b=cur().board,j=i+d;if(j<0||j>=b.length)return;[b[i],b[j]]=[b[j],b[i]];save();render()}
function delPanel(i){confirmBox('Delete panel '+(i+1)+'?',()=>{cur().board.splice(i,1);save();render()})}
function drawPanel(i){const p=cur();
 openModal(`<h3>Panel ${i+1}</h3><canvas id="cv" width="640" height="480"></canvas><div class="row tools">${['#222222','#4f7a1f','#c0392b','#2d6cb5','#e69138','#999999'].map((c,k)=>`<button class="sw ${k?'':'on'}" style="background:${c}" onclick="DR.col='${c}';DR.er=false;markTool(this)" aria-label="Color"></button>`).join('')}<button class="er" onclick="DR.er=true;markTool(this)">Eraser</button><button onclick="DR.w=DR.w===4?10:DR.w===10?2:4;this.textContent='Size '+DR.w">Size 4</button></div><div class="row"><button onclick="drUndo()">↶ Undo</button><button onclick="drClear()">Clear</button><button class="primary" onclick="drSave(${i})">Save</button><button onclick="closeModal()">Cancel</button></div>`);
 const cv=$('#cv'),ctx=cv.getContext('2d');DR={cv,ctx,col:'#222222',w:4,er:false,hist:[]};
 ctx.fillStyle='#fff';ctx.fillRect(0,0,640,480);
 if(p.board[i].img){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,640,480);im.src=p.board[i].img}
 let drawing=false,last=null;
 const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*640/r.width,(e.clientY-r.top)*480/r.height]};
 const width=()=>DR.er?DR.w*4:DR.w;
 const dot=pt=>{ctx.fillStyle=DR.er?'#fff':DR.col;ctx.beginPath();ctx.arc(pt[0],pt[1],width()/2,0,7);ctx.fill()};
 cv.onpointerdown=e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}DR.hist.push(ctx.getImageData(0,0,640,480));if(DR.hist.length>25)DR.hist.shift();drawing=true;last=pos(e);dot(last)};
 cv.onpointermove=e=>{if(!drawing)return;const pt=pos(e);ctx.strokeStyle=DR.er?'#fff':DR.col;ctx.lineWidth=width();ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(pt[0],pt[1]);ctx.stroke();last=pt};
 cv.onpointerup=cv.onpointercancel=()=>{drawing=false};
}
function markTool(b){b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function drUndo(){const h=DR.hist.pop();if(h)DR.ctx.putImageData(h,0,0)}
function drClear(){DR.hist.push(DR.ctx.getImageData(0,0,640,480));DR.ctx.fillStyle='#fff';DR.ctx.fillRect(0,0,640,480)}
function drSave(i){cur().board[i].img=DR.cv.toDataURL('image/jpeg',.6);save();closeModal();render()}

/* ---------- WEB ---------- */
function linksSVG(W){return W.links.map(l=>{const a=W.nodes.find(n=>n.id===l.a),b=W.nodes.find(n=>n.id===l.b);if(!a||!b)return'';const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" class="lnk" ${l.kind&&LINK_KINDS[l.kind]?`style="stroke:${LINK_KINDS[l.kind].c};stroke-dasharray:${LINK_KINDS[l.kind].d};stroke-width:3"`:''}/>${l.label?`<text x="${mx}" y="${my-4}" class="llab">${esc(trim(l.label,22))}</text>`:''}`}).join('')}
function nodesSVG(W){return W.nodes.map(n=>{const t=NODE_TYPES[n.type]||NODE_TYPES.theme;if(n.type==='character'){const G=n.goals||[],w=60/Math.max(1,G.length);return `<g class="node ${n.id===SEL?'sel':''}" data-id="${n.id}" transform="translate(${n.x},${n.y})"><rect class="bx" x="-30" y="-19" width="60" height="38" rx="6" fill="${t.c}"/>${G.map((g,k)=>`<rect x="${-29+k*w*58/60}" y="8" width="${w*58/60}" height="10" fill="${g.color}" opacity="${g.status==='gave'||g.status==='lost'?.3:1}"/>`).join('')}${n.photo?`<image href="${n.photo}" x="-13" y="-18" width="26" height="26" clip-path="url(#ccl)" preserveAspectRatio="xMidYMid slice"/><circle cy="-5" r="13" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`:`<text class="nic" y="2">${ic(t.i)}</text>`}${G.some(g=>g.status==='secret')?'<text x="19" y="-6" font-size="10" pointer-events="none">🔒</text>':''}<text class="nlab" y="34">${esc(trim(n.label,18))}</text></g>`}return `<g class="node ${n.id===SEL?'sel':''}" data-id="${n.id}" transform="translate(${n.x},${n.y})"><circle r="19" fill="${t.c}"/><text class="nic" y="6">${ic(t.i)}</text><text class="nlab" y="34">${esc(trim(n.label,18))}</text></g>`}).join('')}
VIEWS.web=()=>{const p=cur(),W=p.web,sel=W.nodes.find(n=>n.id===SEL);return `<section class="card"><div class="row"><select id="ntype">${Object.entries(NODE_TYPES).map(([k,v])=>`<option value="${k}">${ic(v.i)} ${v.n}</option>`).join('')}</select></div><div class="row"><input id="nlabel" placeholder="Name it… (e.g. Kael, the Salt Desert)" onkeydown="if(event.key==='Enter')addNode()"><button class="primary" onclick="addNode()">＋ Add</button></div>
<div class="row small"><button onclick="zoom(1.25)">＋ Zoom</button><button onclick="zoom(.8)">－ Zoom</button><button onclick="VW={x:0,y:0,k:1};applyView()">Center</button><button class="claude" onclick="webClaude()">✨ Missing links?</button></div>
${LINKING?`<div class="banner">Tap another bubble to connect it to <b>${esc(sel?sel.label:'')}</b> · <a onclick="LINKING=false;render()">cancel</a></div>`:''}
<svg id="web" class="web" viewBox="-180 -160 360 320">${CCL}<g id="vw"><g id="lk">${linksSVG(W)}</g>${nodesSVG(W)}</g></svg>
<div class="legend">${Object.values(NODE_TYPES).map(v=>`<span><i style="background:${v.c}"></i>${v.n}</span>`).join('')}</div><p class="hint">Characters are boxes — tap one to give it goals (the colored strip), a why, and a background. Lines: green = same goal, red = against, dotted = secret.</p></section>
${sel?nodePanel(sel,W):`<p class="hint center">${W.nodes.length?'Tap a bubble to edit it. Drag bubbles to move them; drag the background to move around.':'Add your first idea above — a character, a place, a god, anything.'}</p>`}`};
function nodePanel(n,W){const ls=W.links.filter(l=>l.a===n.id||l.b===n.id);return `<section class="card"><div class="row"><select onchange="setNode('type',this.value);render()">${Object.entries(NODE_TYPES).map(([k,v])=>`<option value="${k}" ${k===n.type?'selected':''}>${ic(v.i)} ${v.n}</option>`).join('')}</select></div>
<label class="lbl">Name</label><input value="${esc(n.label)}" oninput="setNode('label',this.value)" onchange="render()">
<label class="lbl">Notes</label><textarea rows="5" oninput="setNode('notes',this.value)" placeholder="Anything about it…">${esc(n.notes||'')}</textarea>
${n.type==='character'?charBox(n):''}
<div class="row"><button class="primary" onclick="LINKING=true;render()">🔗 Connect</button><button onclick="nodeCards()">🃏 Questions</button></div>
<div class="row"><button class="claude" onclick="nodeClaude()">✨ Ask Claude</button><button class="danger" onclick="delNode()">🗑 Delete</button></div>
${ls.length?'<h3>Connections</h3>'+ls.map(l=>{const o=W.nodes.find(x=>x.id===(l.a===n.id?l.b:l.a));return o?`<div class="lblock"><div class="lrow"><span>${l.a===n.id?'→':'←'} <b>${esc(o.label)}</b></span><input value="${esc(l.label||'')}" placeholder="how? (owes a debt, worships…)" oninput="setLink('${l.id}',this.value)"><button class="x" onclick="delLink('${l.id}')" aria-label="Remove">×</button></div><select onchange="setLinkKind('${l.id}',this.value)">${Object.entries(LINK_KINDS).map(([k,v])=>`<option value="${k}" ${k===(l.kind||'')?'selected':''}>${v.n}</option>`).join('')}</select></div>`:''}).join(''):''}</section>`}
function applyView(){const g=$('#vw');if(g)g.setAttribute('transform',`translate(${VW.x},${VW.y}) scale(${VW.k})`)}
function zoom(f){VW.k=Math.max(.3,Math.min(3,VW.k*f));applyView()}
function addNode(){const lab=$('#nlabel').value.trim();if(!lab){toast('Give it a name first');$('#nlabel').focus();return}
 const W=cur().web,cx=(-VW.x)/VW.k,cy=(-VW.y)/VW.k;let best=null,bd=-1;for(let t=0;t<40;t++){const a=Math.random()*6.28,r=30+Math.random()*120,x=cx+Math.cos(a)*r*1.2,y=cy+Math.sin(a)*r*.9,d=Math.min(999,...W.nodes.map(m=>Math.hypot(m.x-x,m.y-y)));if(d>bd){bd=d;best=[x,y]}if(d>90)break}const n={id:uid(),type:$('#ntype').value,label:lab,notes:'',x:Math.round(best[0]),y:Math.round(best[1])};
 W.nodes.push(n);if(SEL&&!LINKING&&W.nodes.find(x=>x.id===SEL))W.links.push({id:uid(),a:SEL,b:n.id,label:''});save();render();toast(SEL?'Added and connected to the selected bubble':'Added')}
function setNode(k,v){const n=cur().web.nodes.find(x=>x.id===SEL);if(n){n[k]=v;save()}}
function setLink(id,v){const l=cur().web.links.find(x=>x.id===id);if(l){l.label=v;save();const g=$('#lk');if(g)g.innerHTML=linksSVG(cur().web)}}
function delLink(id){const W=cur().web;W.links=W.links.filter(x=>x.id!==id);save();render()}
function delNode(){const n=cur().web.nodes.find(x=>x.id===SEL);confirmBox('Delete "'+(n?n.label:'')+'"?',()=>{const W=cur().web;W.nodes=W.nodes.filter(x=>x.id!==SEL);W.links=W.links.filter(l=>l.a!==SEL&&l.b!==SEL);SEL=null;save();render()})}
function tapNode(id){const W=cur().web;if(LINKING&&SEL&&id!==SEL){if(!W.links.some(l=>(l.a===SEL&&l.b===id)||(l.a===id&&l.b===SEL)))W.links.push({id:uid(),a:SEL,b:id,label:''});LINKING=false;save();render();toast('Connected — say how in the box below');return}SEL=id;LINKING=false;render()}
function nodeCards(){const n=cur().web.nodes.find(x=>x.id===SEL);DECK=TYPE_DECK[n.type]||'plot';QI=0;ABOUT=n.id;go('cards')}
after.web=()=>{const svg=$('#web');if(!svg)return;applyView();let mode=null,start=null,node=null,moved=false,orig=null;
 const pt=e=>{const r=svg.getBoundingClientRect();const s=360/r.width;return[(e.clientX-r.left)*s,(e.clientY-r.top)*s]};
 svg.onpointerdown=e=>{const g=e.target.closest('.node');start=pt(e);moved=false;try{svg.setPointerCapture(e.pointerId)}catch(_){}
  if(g){mode='node';node=cur().web.nodes.find(n=>n.id===g.dataset.id);orig=[node.x,node.y]}else{mode='pan';orig=[VW.x,VW.y]}};
 svg.onpointermove=e=>{if(!mode)return;const q=pt(e),dx=q[0]-start[0],dy=q[1]-start[1];if(Math.abs(dx)+Math.abs(dy)>5)moved=true;if(!moved)return;
  if(mode==='node'){node.x=Math.round(orig[0]+dx/VW.k);node.y=Math.round(orig[1]+dy/VW.k);const g=svg.querySelector(`.node[data-id="${node.id}"]`);if(g)g.setAttribute('transform',`translate(${node.x},${node.y})`);$('#lk').innerHTML=linksSVG(cur().web)}
  else{VW.x=orig[0]+dx;VW.y=orig[1]+dy;applyView()}};
 svg.onpointerup=svg.onpointercancel=e=>{if(mode==='node'){if(moved)save();else tapNode(node.id)}else if(mode==='pan'&&!moved&&SEL&&!LINKING){SEL=null;render()}mode=null};
};
function webClaude(){askClaude('Missing links','Look at my idea web. Suggest 5 surprising but logical connections between items that already exist (format: A → B: why), then 2 new items that would make the world richer and how they connect.')}
function nodeClaude(){const n=cur().web.nodes.find(x=>x.id===SEL);askClaude('About '+n.label,`Focus on "${n.label}" (${NODE_TYPES[n.type].n}). Ask me 5 sharp questions about it, then give 2 ideas that tie it to the ending or to another item in my web.`)}

/* ---------- CARDS ---------- */
VIEWS.cards=()=>`<div class="seg"><button class="${CMODE==='decks'?'on':''}" onclick="CMODE='decks';render()">🃏 Decks</button><button class="${CMODE==='trails'?'on':''}" onclick="CMODE='trails';render()">🧭 Question trails</button></div>`+(CMODE==='trails'?trailsView():decksView());
function decksView(){const d=DECKS[DECK],p=cur(),i=((QI%d.q.length)+d.q.length)%d.q.length,q=CUSTOMQ||d.q[i],ans=p.notes.filter(n=>n.deck===d.n).length;if(ABOUT&&!p.web.nodes.find(n=>n.id===ABOUT))ABOUT='';
return `<div class="chips">${Object.entries(DECKS).map(([k,v])=>`<button class="chip ${k===DECK?'on':''}" onclick="setDeck('${k}')">${ic(v.i)} ${v.n}</button>`).join('')}</div>
<section class="card qcard"><div class="qmeta">${ic(d.i)} ${d.n} · ${CUSTOMQ?'↳ going deeper':'card '+(i+1)+' of '+d.q.length} · ${ans} answered</div><div class="bigq">${esc(q)}</div>
<label class="lbl">This answer is about</label><select onchange="ABOUT=this.value"><option value="">The whole story</option>${p.web.nodes.map(n=>`<option value="${n.id}" ${n.id===ABOUT?'selected':''}>${ic(NODE_TYPES[n.type].i)} ${esc(n.label)}</option>`).join('')}</select>
<textarea id="qans" rows="4" placeholder="Write anything — messy is fine."></textarea>
<div class="row"><button onclick="nextQ(-1)" aria-label="Previous">◀</button><button onclick="nextQ(1)">Skip ▶</button><button onclick="nextQ(0)" aria-label="Shuffle">🔀</button><button class="primary" onclick="saveAns()">Save</button></div>
<div class="row"><button onclick="randomAny()">🎲 Any deck</button><button class="claude" onclick="deckClaude()">✨ Questions made for my story</button></div></section>
${FOLLOW?`<section class="card follow"><h3>↳ Go deeper</h3><p class="hint">On your answer: "${esc(trim(FOLLOW.a,90))}"</p>${FOLLOW.list.map((f,k)=>`<button class="fq" onclick="CUSTOMQ=FOLLOW.list[${k}];render();window.scrollTo(0,0)">${esc(f)}</button>`).join('')}<div class="row"><button onclick="FOLLOW.list=digPick();render()">🔀 Other follow-ups</button><button onclick="FOLLOW=null;render()">Done</button></div><button class="claude" onclick="followClaude()">✨ Follow-ups made from my answer</button></section>`:''}<p class="hint center">Answers go to Home → Notes${ABOUT?' and into that bubble\'s notes on the Web':''}.</p>`}
function digPick(){const a=DIG.slice().sort(()=>Math.random()-.5);return a.slice(0,3)}
function followClaude(){askClaude('Go deeper',`I was asked: "${FOLLOW.q}" and I answered: "${FOLLOW.a}". Ask me 5 follow-up questions that dig into my answer — each one should open a new door (a cause, a cost, a secret, a person affected, a scene). Number them.`)}
function setDeck(k){DECK=k;QI=0;CUSTOMQ=null;render()}
function nextQ(d){CUSTOMQ=null;const n=DECKS[DECK].q.length;if(d===0){let r;do{r=Math.floor(Math.random()*n)}while(n>1&&r===((QI%n)+n)%n);QI=r}else QI+=d;render()}
function randomAny(){CUSTOMQ=null;DECK=pick(Object.keys(DECKS));QI=Math.floor(Math.random()*DECKS[DECK].q.length);render()}
function saveAns(){const d=DECKS[DECK],p=cur(),a=$('#qans').value,q=CUSTOMQ||d.q[((QI%d.q.length)+d.q.length)%d.q.length],n=p.web.nodes.find(x=>x.id===ABOUT);
 if(!saveNote(q,a,d.n,n?n.label:''))return;if(n){n.notes=(n.notes?n.notes+'\n\n':'')+'Q: '+q+'\nA: '+a;save()}if(!CUSTOMQ)QI++;CUSTOMQ=null;FOLLOW={q,a,list:digPick()};render();setTimeout(()=>{const f=document.querySelector('.follow');if(f)f.scrollIntoView({behavior:'smooth'})},50)}
function deckClaude(){const d=DECKS[DECK],n=cur().web.nodes.find(x=>x.id===ABOUT);askClaude(d.n+' questions',`Write 8 new, specific questions in the style of a "${d.n}" question deck, tailored to THIS project${n?` and especially to "${n.label}"`:''}. Use the names and details from my project. They should push me to think creatively and solve problems, not just list facts. Number them.`)}

/* ---------- TRAILS ---------- */
function trailsView(){if(!TR)return `<p class="hint center">Every answer opens the next question. Your choices pick the path.</p>`+Object.entries(TRAILS).map(([k,t])=>`<section class="card tap" onclick="startTrail('${k}')"><h3>${ic(t.i)} ${t.n}</h3><p class="hint">${esc(t.d)}</p></section>`).join('');
 const T=TRAILS[TR.k];
 if(TR.done)return `<section class="card"><h2>${ic(T.i)} ${T.n} — done!</h2>${TR.hist.map(h=>`<div class="note"><b>${esc(h.q)}</b><div>${esc(h.a)}</div></div>`).join('')}<div class="row"><button class="primary" onclick="saveTrail()">Save to notes</button><button onclick="startTrail(TR.k)">Do it again</button></div><div class="row"><button onclick="TR=null;render()">All trails</button></div><button class="claude" onclick="trailClaude()">✨ What should I ask myself next?</button></section>`;
 const st=T.st[TR.cur];
 return `<section class="card qcard"><div class="qmeta">${ic(T.i)} ${T.n} · question ${TR.hist.length+1}</div><div class="bigq">${esc(st.q)}</div>${st.o?st.o.map((o,k)=>`<button class="fq" onclick="trailPick(${k})">${esc(o[0])}</button>`).join(''):`<textarea id="tra" rows="4" placeholder="Write anything — messy is fine."></textarea><div class="row"><button class="primary" onclick="trailNext()">${st.n?'Next ▶':'Finish ✓'}</button></div>`}<div class="row"><button onclick="trailBack()">◀ Back</button><button onclick="TR=null;render()">Quit</button></div></section>
 ${TR.hist.length?`<section class="card"><h3>Your path so far</h3>${TR.hist.map(h=>`<div class="prow"><b>${esc(h.q)}</b><span>${esc(trim(h.a,100))}</span></div>`).join('')}</section>`:''}`}
function startTrail(k){TR={k,cur:TRAILS[k].s,hist:[],done:false};render();window.scrollTo(0,0)}
function trailGo(a,next){TR.hist.push({id:TR.cur,q:TRAILS[TR.k].st[TR.cur].q,a});if(next)TR.cur=next;else TR.done=true;render();window.scrollTo(0,0)}
function trailPick(k){const o=TRAILS[TR.k].st[TR.cur].o[k];trailGo(o[0],o[1])}
function trailNext(){const v=$('#tra').value.trim();if(!v){toast('Write something first — even one word');return}trailGo(v,TRAILS[TR.k].st[TR.cur].n)}
function trailBack(){if(!TR.hist.length){TR=null;render();return}TR.done=false;TR.cur=TR.hist.pop().id;render()}
function saveTrail(){saveNote('Trail: '+TRAILS[TR.k].n,TR.hist.map(h=>h.q+'\n→ '+h.a).join('\n\n'),'Trails')}
function trailClaude(){askClaude('Next questions',`I just did the "${TRAILS[TR.k].n}" question trail. My path:\n${TR.hist.map(h=>'- '+h.q+' → '+h.a).join('\n')}\nAsk me 5 follow-up questions that build on my answers and lead somewhere new. Number them.`)}

/* ---------- OLD IN NEW ---------- */
function newRmx(){return{t:Math.floor(Math.random()*TALES.length),p:pick(REMIX_PLACES),f:Math.floor(Math.random()*TWIST_TOOLS.length)}}
function remixView(){if(!RMX)RMX=newRmx();const t=TALES[RMX.t],f=TWIST_TOOLS[RMX.f];return `<section class="card intro">Almost every big story is an old story in new clothes. The recipe: <b>keep the core idea, change the costume, flip one thing.</b></section>
<section class="card"><h2>🔁 Remix recipe</h2><div class="recipe"><div><span>Keep</span><b>${esc(t[0])}</b> — ${esc(t[3])}</div><div><span>Move it to</span><b>${esc(RMX.p)}</b></div><div><span>Flip</span><b>${esc(f[0])}</b> — ${esc(f[1])}</div></div>
<div class="chips"><button class="chip" onclick="RMX.t=Math.floor(Math.random()*TALES.length);render()">🎲 tale</button><button class="chip" onclick="RMX.p=pick(REMIX_PLACES);render()">🎲 place</button><button class="chip" onclick="RMX.f=Math.floor(Math.random()*TWIST_TOOLS.length);render()">🎲 flip</button><button class="chip" onclick="RMX=newRmx();render()">🎲 all</button></div>
<p class="q">Who is your version's hero in ${esc(RMX.p)}? What does "${esc(t[3].toLowerCase())}" look like there — and how does the flip change the ending?</p><textarea id="rmxa" rows="4" placeholder="Your remix…"></textarea>
<div class="row"><button class="primary" onclick="saveNote('Remix: '+TALES[RMX.t][0]+' in '+RMX.p+' (flip: '+TWIST_TOOLS[RMX.f][0]+')',$('#rmxa').value,'Remix')">Save</button><button onclick="TOOL='tales';OPENTALE=RMX.t;render()">📜 Read the tale</button></div><button class="claude" onclick="remixClaude()">✨ Claude, remix it with me</button></section>
<h2 class="sect">Old stories inside famous ones</h2><p class="hint" style="margin:4px">How well-known stories borrowed from the old ones. Some are confirmed by the creator; some are fan theories, marked as such.</p>
${ECHOES.map(e=>`<section class="card echo"><h3>${esc(e[0])}</h3><span class="tag">${esc(e[1])}</span> <span class="tag ${/theory/i.test(e[5])?'warn':'alt'}">${esc(e[5])}</span><p><b>Borrowed from:</b> ${esc(e[2])}</p><p>${esc(e[3])}</p><p class="motif">The twist: ${esc(e[4])}</p></section>`).join('')}`}
function remixClaude(){const t=TALES[RMX.t],f=TWIST_TOOLS[RMX.f];askClaude('Remix: '+t[0],`Remix the old story "${t[0]}" (${t[2]}) into ${RMX.p}, using this flip: ${f[0]} — ${f[1]}. Keep its core idea (${t[3]}). Give: a title, the hero, the setup in 2 sentences, how the flip changes things, one wink to the original, and the ending. If it fits my current project, connect it.`)}

/* ---------- SKETCH PAD ---------- */
function skNew(o){const cv=document.createElement('canvas');cv.width=o==='l'?960:720;cv.height=o==='l'?640:1080;cv.id='sk';const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
 SK={cv,ctx,o,tool:'pen',col:'#222222',w:4,hist:[],name:''};skBind()}
function skBind(){const {cv,ctx}=SK;let down=false,last=null,start=null,snap=null;
 const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
 const style=()=>{ctx.strokeStyle=SK.tool==='eraser'?'#fff':SK.col;ctx.fillStyle=SK.col;ctx.lineWidth=SK.tool==='eraser'?SK.w*5:SK.w;ctx.lineCap='round';ctx.lineJoin='round'};
 cv.onpointerdown=e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}SK.hist.push(ctx.getImageData(0,0,cv.width,cv.height));if(SK.hist.length>30)SK.hist.shift();start=last=pos(e);down=true;style();
  if(SK.tool==='text'){const t=($('#sktext')||{}).value||'';if(!t.trim()){SK.hist.pop();toast('Type the text in the box first, then tap where it goes');down=false;return}ctx.font=`700 ${16+SK.w*4}px Nunito, sans-serif`;ctx.textBaseline='middle';ctx.fillText(t,start[0],start[1]);down=false;return}
  if(SK.tool==='box'||SK.tool==='arrow')snap=ctx.getImageData(0,0,cv.width,cv.height);
  else{ctx.beginPath();ctx.arc(start[0],start[1],ctx.lineWidth/2,0,7);ctx.fillStyle=SK.tool==='eraser'?'#fff':SK.col;ctx.fill()}};
 cv.onpointermove=e=>{if(!down)return;const p=pos(e);style();
  if(SK.tool==='box'){ctx.putImageData(snap,0,0);ctx.strokeRect(start[0],start[1],p[0]-start[0],p[1]-start[1])}
  else if(SK.tool==='arrow'){ctx.putImageData(snap,0,0);ctx.beginPath();ctx.moveTo(start[0],start[1]);ctx.lineTo(p[0],p[1]);const a=Math.atan2(p[1]-start[1],p[0]-start[0]),h=12+SK.w*2;ctx.lineTo(p[0]-h*Math.cos(a-.5),p[1]-h*Math.sin(a-.5));ctx.moveTo(p[0],p[1]);ctx.lineTo(p[0]-h*Math.cos(a+.5),p[1]-h*Math.sin(a+.5));ctx.stroke()}
  else{ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke()}last=p};
 cv.onpointerup=cv.onpointercancel=()=>{down=false}}
function skMount(){if(!SK)skNew('p');const h=$('#skhold');if(h)h.appendChild(SK.cv)}
function sketchView(){if(!SK)skNew('p');const p=cur();p.sketches=p.sketches||[];
 const tools=[['pen','✏️ Pen'],['box','⬜ Box'],['arrow','➡️ Arrow'],['text','🔤 Text'],['eraser','🧽 Eraser']];
 return `<section class="card"><p class="hint">Draw a layout, a map, a character, a panel — anything. Download it to keep it.</p>
<div class="row"><button class="${SK.o==='p'?'primary':''}" onclick="skOrient('p')">📱 Tall</button><button class="${SK.o==='l'?'primary':''}" onclick="skOrient('l')">🖥 Wide</button></div>
<div id="skhold" class="skhold ${SK.o}"></div>
<div class="row tools">${['#222222','#4f7a1f','#c0392b','#2d6cb5','#e69138','#8e7cc3','#999999'].map(c=>`<button class="sw ${SK.col===c?'on':''}" style="background:${c}" onclick="SK.col='${c}';if(SK.tool==='eraser')SK.tool='pen';render()" aria-label="Color"></button>`).join('')}</div>
<div class="chips">${tools.map(t=>`<button class="chip ${SK.tool===t[0]?'on':''}" onclick="SK.tool='${t[0]}';render()">${t[1]}</button>`).join('')}<button class="chip" onclick="SK.w=SK.w===2?4:SK.w===4?8:SK.w===8?14:2;render()">Size ${SK.w}</button></div>
${SK.tool==='text'?`<input id="sktext" placeholder="Type a label, then tap the drawing to place it" value="${esc(SK.txt||'')}" oninput="SK.txt=this.value">`:''}
<div class="row"><button onclick="skUndo()">↶ Undo</button><button onclick="skClear()">Clear</button></div>
<div class="row"><input placeholder="Name this sketch" value="${esc(SK.name)}" oninput="SK.name=this.value"><button class="primary" onclick="skSave()">Save</button></div>
<button onclick="skDownload()">⬇️ Download picture (to send in chat)</button></section>
<section class="card"><h2>Saved sketches (${p.sketches.length})</h2>${p.sketches.length?`<div class="board">${p.sketches.map((k,i)=>`<div class="panel"><div class="pimg" onclick="skLoad(${i})"><img src="${k.img}" alt="${esc(k.name)}"></div><div class="pbtns"><span class="sname">${esc(trim(k.name,24))}</span><button onclick="skDel(${i})" aria-label="Delete">🗑</button></div></div>`).join('')}</div>`:'<p class="hint">Saved sketches stay with this project.</p>'}</section>`}
function skOrient(o){if(SK.o===o)return;const go=()=>{skNew(o);render()};if(SK.hist.length)confirmBox('Start a new blank sketch? Unsaved drawing will be cleared.',go);else go()}
function skUndo(){const h=SK.hist.pop();if(h)SK.ctx.putImageData(h,0,0)}
function skClear(){SK.hist.push(SK.ctx.getImageData(0,0,SK.cv.width,SK.cv.height));SK.ctx.fillStyle='#fff';SK.ctx.fillRect(0,0,SK.cv.width,SK.cv.height)}
function skSave(){const p=cur();p.sketches=p.sketches||[];p.sketches.push({id:uid(),name:SK.name||'Sketch '+(p.sketches.length+1),o:SK.o,img:SK.cv.toDataURL('image/jpeg',.75)});save();toast('Sketch saved to this project');render()}
function skLoad(i){const k=cur().sketches[i];skNew(k.o||'p');SK.name=k.name;const im=new Image();im.onload=()=>SK.ctx.drawImage(im,0,0,SK.cv.width,SK.cv.height);im.src=k.img;render();window.scrollTo(0,0)}

async function askClaude(title,task){
 if(!SAMPLE){toast('Claude isn\'t available on this page right now.');return}
 CLTITLE=title;CLOUT='';
 openModal(`<h3>✨ ${esc(title)}</h3><div id="clout" class="clout">Thinking…</div><div class="row"><button class="primary" id="clsave" disabled onclick="if(saveNote(CLTITLE,CLOUT,'Claude'))closeModal()">Save to notes</button><button onclick="closeModal()">Close</button></div>`);
 const ctrl=new AbortController();CLABORT=ctrl;
 const prompt=`You are a creative writing coach inside a story-planning app called Story Shelf. The user is building stories (books, comics, D&D, games) and learns best by being asked good questions and given simple, vivid ideas. Write in plain, simple English. Be specific to their project and use its names. Keep it short and scannable: under 220 words, short numbered lists, no markdown headers, no bold.\n\n${projContext()}\n\nTASK: ${task}`;
 try{const r=await SAMPLE(prompt,{signal:ctrl.signal,cache:false,onText:({text})=>{CLOUT=text;const o=$('#clout');if(o)o.textContent=text}});
  CLOUT=r.text||CLOUT;const o=$('#clout');if(o)o.textContent=CLOUT;const b=$('#clsave');if(b)b.disabled=false}
 catch(e){if(ctrl.signal.aborted)return;const o=$('#clout');if(o)o.textContent=e&&e.code==='rate_limited'?'Claude is busy — try again in a minute.':e&&e.code==='not_granted'?'Claude access wasn\'t allowed on this page.':'Something went wrong. Try again in a bit.';
  if(e&&e.code==='not_granted'){SAMPLE=null;document.body.classList.remove('has-claude')}}
 finally{if(CLABORT===ctrl)CLABORT=null}
}
