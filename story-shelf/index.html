function cbSet(k,v){const n=selNode();if(n){(n.c=n.c||{})[k]=v;save()}}
function cbAddGoal(){const n=selNode();if(!n)return;n.goals=n.goals||[];n.goals.push({id:uid(),text:'',why:'',color:GCOL[n.goals.length%GCOL.length],status:'chasing',then:''});save();render()}
function cbGoal(id,k,v){const n=selNode(),g=n&&(n.goals||[]).find(x=>x.id===id);if(g){g[k]=v;save()}}
function cbGoalColor(id){const n=selNode(),g=n&&(n.goals||[]).find(x=>x.id===id);if(g){g.color=GCOL[(GCOL.indexOf(g.color)+1)%GCOL.length];save();render()}}
function cbDelGoal(id){const n=selNode();if(n){n.goals=(n.goals||[]).filter(x=>x.id!==id);save();render()}}
function cbClaude(){const n=selNode();askClaude('Test '+n.label,`Focus on the character "${n.label}". Using their goals, the reasons behind them and their background, tell me: 1) which of their goals clashes with another character's goal, 2) what they may have to give up, and for who, 3) one moment that would make a reader see them as grey instead of plain good or bad. Then ask me 3 short questions I haven't answered yet.`)}
function setLinkKind(id,v){const l=cur().web.links.find(x=>x.id===id);if(l){l.kind=v;save();render()}}
function boxText(p){let t='';chars(p).forEach(n=>{const c=n.c||{},G=n.goals||[];if(!G.length&&!Object.values(c).some(x=>x))return;t+=`\n${n.label}:\n`;
 G.forEach(g=>t+=`  goal: ${g.text||'?'} — why: ${g.why||'?'} [${(GOAL_STATUS[g.status]||GOAL_STATUS.chasing).n}${g.then?': '+g.then:''}]\n`);
 [['parents','parents'],['from','background'],['wound','shaped by'],['shaped','took it'],['stress','under pressure'],['role','role'],['learn','learns/teaches'],['start','starts as'],['end','ends as']].forEach(([k,l])=>{if(c[k])t+=`  ${l}: ${c[k]}\n`})});
 return t?'\n== Character boxes =='+t:''}

/* ---------- STAFF ---------- */
const ST={P:14,CW:58,T:30,LH:74};
function stf(p){p=p||cur();if(!p.staff)p.staff={lines:[{id:uid(),name:'Main story',color:GCOL[5]}],beats:[],marks:[]};return p.staff}
let STTOP=ST.T,STFOL=null;const STB_H=58;
const stX=c=>ST.P+c*ST.CW+ST.CW/2,stY=i=>STTOP+i*ST.LH+ST.LH/2+8;
function staffSVG(p){const F=stf(p),L=F.lines,n=Math.max(6,...F.beats.map(b=>b.col+3),...F.marks.map(m=>m.col+2),STSLOT?STSLOT.col+2:0);
 const TB=F.beats.some(b=>b.ten);STTOP=ST.T+(TB?STB_H:0);
 const W=ST.P*2+n*ST.CW,H=STTOP+L.length*ST.LH+16,li=id=>L.findIndex(l=>l.id===id);
 let s=`<svg id="staff" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
 if(TB){const ty=v=>ST.T-6+(5-v)*10,cols={};F.beats.forEach(b=>{if(b.ten&&li(b.line)>=0)cols[b.col]=Math.max(cols[b.col]||0,b.ten)});const pts=Object.keys(cols).map(Number).sort((a,b)=>a-b).map(c=>[stX(c),ty(cols[c])]);
  s+=`<rect x="${ST.P}" y="${ST.T-12}" width="${W-ST.P*2}" height="52" rx="8" class="tband"/><text x="${ST.P+4}" y="${ty(5)+4}" class="tdyn">ff</text><text x="${ST.P+4}" y="${ty(1)+4}" class="tdyn">pp</text>`;
  if(pts.length>1)s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#e06666" stroke-width="3" stroke-linejoin="round"/>`;pts.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#e06666"/>`)}
 for(let c=0;c<n;c++)s+=`<text x="${stX(c)}" y="${H-3}" class="stn">${c+1}</text>`;
 L.forEach((l,i)=>{s+=`<line x1="${ST.P}" x2="${W-ST.P}" y1="${stY(i)}" y2="${stY(i)}" stroke="${l.color}" stroke-width="4" stroke-linecap="round"/><circle cx="${ST.P+5}" cy="${stY(i)-30}" r="5" fill="${l.color}"/><text x="${ST.P+14}" y="${stY(i)-25}" class="stname">${esc(trim(l.name,34))}</text>`});
 F.marks.forEach(m=>{const x=ST.P+m.col*ST.CW;s+=`<line x1="${x}" x2="${x}" y1="14" y2="${H-14}" class="stmark"/><text x="${x+4}" y="12" class="stmlab">${esc(trim(m.label||'Arc',16))}</text>`});
 if(STSLOT&&li(STSLOT.line)>=0)s+=`<circle cx="${stX(STSLOT.col)}" cy="${stY(li(STSLOT.line))}" r="16" class="stslot"/>`;
 F.beats.forEach(b=>{const i=li(b.line);if(i<0)return;const x=stX(b.col),y=stY(i),col=L[i].color;
  (b.meets||[]).forEach(m=>{const j=li(m);if(j<0)return;s+=`<line x1="${x}" x2="${x}" y1="${y}" y2="${stY(j)}" stroke="${col}" stroke-width="3" stroke-dasharray="6 4"/><circle cx="${x}" cy="${stY(j)}" r="7" fill="var(--bg)" stroke="${L[j].color}" stroke-width="3"/>`});
  const o=b.pays&&F.beats.find(z=>z.id===b.pays),oi=o?li(o.line):-1;if(o&&oi>=0){const x2=stX(o.col),y2=stY(oi);s+=`<path d="M${x2} ${y2-16} Q${(x+x2)/2} ${Math.min(y,y2)-46} ${x} ${y-16}" fill="none" stroke="#4f9a3a" stroke-width="2" stroke-dasharray="3 4"/>`}});
 F.beats.forEach(b=>{const i=li(b.line);if(i<0)return;const x=stX(b.col),y=stY(i),t=BEAT_TYPES[b.type]||BEAT_TYPES.scene;
  s+=`<g class="bt ${b.id===STB?'sel':''} ${STFOL&&!(b.chars||[]).includes(STFOL)?'dim':''}" data-id="${b.id}" transform="translate(${x},${y})">${b.type==='wall'?'<rect x="-9" y="-24" width="18" height="48" rx="3" fill="var(--card)"/>':`<circle r="15" fill="${b.type==='scene'?L[i].color:'var(--card)'}"/>`}<text class="bti" y="5">${b.type==='scene'?'':t.i}</text><text class="btl" y="${b.type==='wall'?36:29}">${esc(trim(b.title||t.n,10))}</text></g>`});
 return s+'</svg>'}
VIEWS.staff=()=>{const p=cur(),F=stf(p),b=F.beats.find(x=>x.id===STB);
 return `<section class="card"><h2>🎼 Story staff</h2><p class="hint">Like sheet music. Each line is one story, each note is a moment. <b>Tap an empty spot on a line</b> to add a moment there. Dashed drops show where stories cross; green arcs show a small moment paying off later. Give moments a tension level and a red line shows the story's rhythm, like loud and quiet parts in music.</p>
${chars(p).length?`<div class="tgl"><span class="hint" style="align-self:center">Follow:</span><button class="chip ${STFOL?'':'on'}" onclick="STFOL=null;render()">Everyone</button>${chars(p).map(c=>`<button class="chip ${STFOL===c.id?'on':''}" onclick="STFOL=STFOL==='${c.id}'?null:'${c.id}';render()">${esc(trim(c.label,14))}</button>`).join('')}</div>`:''}<div id="sthold" class="sthold">${staffSVG(p)}</div>${STFOL?`<p class="hint">Showing ${esc((p.web.nodes.find(n=>n.id===STFOL)||{}).label||'')} — ${F.beats.filter(b=>(b.chars||[]).includes(STFOL)).length} moments. Faded moments are ones they are not in.</p>`:''}
<div class="row small"><button onclick="stAddLine()">＋ Story line</button><button onclick="stAddMark()">＋ Arc divider</button></div>
<button class="claude" onclick="askClaude('Where stories cross','Look at my story lines and moments. Suggest 3 places where two story lines could cross and what each side gains or loses there, 2 small moments I could plant early that pay off later, and 1 wall the main story is missing.')">✨ Where should stories cross?</button></section>
${STSLOT?slotPanel(F):b?beatPanel(p,F,b):''}${linesCard(F)}${themeCard(p,F)}${checkCard(p,F)}`};
after.staff=()=>{const svg=$('#staff'),h=$('#sthold');if(!svg)return;h.scrollLeft=STSCROLL;h.onscroll=()=>{STSCROLL=h.scrollLeft};
 svg.onclick=e=>{const g=e.target.closest('.bt');if(g){STB=g.dataset.id;STSLOT=null;render();return}
  const r=svg.getBoundingClientRect(),F=stf(),c=Math.floor((e.clientX-r.left-ST.P)/ST.CW),i=Math.floor((e.clientY-r.top-STTOP)/ST.LH);
  if(c<0||i<0||i>=F.lines.length)return;STB=null;STSLOT={line:F.lines[i].id,col:c};render()}};
function slotPanel(F){const l=F.lines.find(x=>x.id===STSLOT.line);return `<section class="card qcard"><h3>New moment — ${esc(l?l.name:'')}, spot ${STSLOT.col+1}</h3><p class="hint">What kind of moment is it?</p><div class="kinds">${Object.entries(BEAT_TYPES).map(([k,v])=>`<button onclick="stAddBeat('${k}')">${v.i} ${v.n}</button>`).join('')}</div><button onclick="STSLOT=null;render()">Cancel</button></section>`}
function stAddBeat(type){const F=stf();const b={id:uid(),line:STSLOT.line,col:STSLOT.col,type,title:'',notes:'',chars:[],themes:[],meets:[],pays:'',x:[],w:{}};F.beats.push(b);STB=b.id;STSLOT=null;save();render()}
function stBeat(){return stf().beats.find(x=>x.id===STB)}
function stSet(k,v,re){const b=stBeat();if(b){b[k]=v;save();if(re)render()}}
function stX2(i,v){const b=stBeat();if(b){(b.x=b.x||[])[i]=v;save()}}
function stWant(id,v){const b=stBeat();if(b){(b.w=b.w||{})[id]=v;save()}}
function stTog(k,id){const b=stBeat();if(!b)return;const a=b[k]=b[k]||[];const i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);save();render()}
function stMove(d){const b=stBeat();if(b){b.col=Math.max(0,b.col+d);save();render()}}
function stDelBeat(){const F=stf();confirmBox('Delete this moment?',()=>{F.beats=F.beats.filter(x=>x.id!==STB);F.beats.forEach(x=>{if(x.pays===STB)x.pays=''});STB=null;save();render()})}
function quickNode(type,inp,k){const el=$('#'+inp),lab=el&&el.value.trim();if(!lab){toast('Type a name first');return}const W=cur().web,n={id:uid(),type,label:lab,notes:'',x:Math.round(Math.random()*240-120),y:Math.round(Math.random()*200-100)};W.nodes.push(n);const b=stBeat();if(b&&k)(b[k]=b[k]||[]).push(n.id);save();render()}
function beatPanel(p,F,b){const t=BEAT_TYPES[b.type]||BEAT_TYPES.scene,C=chars(p),T=themesOf(p),inC=C.filter(c=>(b.chars||[]).includes(c.id));
 const earlier=F.beats.filter(x=>x.id!==b.id&&x.col<=b.col).sort((a,c)=>a.col-c.col);
 const tg=(k,list)=>`<div class="tgl">${list.map(n=>`<button class="chip ${(b[k]||[]).includes(n.id)?'on':''}" onclick="stTog('${k}','${n.id}')">${esc(trim(n.label||n.name,18))}</button>`).join('')}</div>`;
 return `<section class="card qcard"><div class="row small"><select onchange="stSet('type',this.value,1)">${Object.entries(BEAT_TYPES).map(([k,v])=>`<option value="${k}" ${k===b.type?'selected':''}>${v.i} ${v.n}</option>`).join('')}</select><button onclick="stMove(-1)" aria-label="Move earlier">◀</button><button onclick="stMove(1)" aria-label="Move later">▶</button></div>
<label class="lbl">Name this moment</label><input value="${esc(b.title)}" placeholder="Short name" oninput="stSet('title',this.value)" onchange="render()">
<label class="lbl">What happens</label><textarea rows="3" oninput="stSet('notes',this.value)" placeholder="${b.type==='talk'?'What do they talk about?':'What happens here?'}">${esc(b.notes)}</textarea>
<label class="lbl">When? (optional)</label><input value="${esc(b.when||'')}" placeholder="Day 1 · that night · 10 years later" oninput="stSet('when',this.value)">
<label class="lbl">Tension — how loud is this moment?</label><div class="tgl">${[1,2,3,4,5].map(v=>`<button class="chip ${b.ten===v?'on':''}" onclick="stSet('ten',${b.ten===v?0:v},1)">${DYN[v].split(' ')[0]}</button>`).join('')}</div><p class="hint">${b.ten?esc(DYN[b.ten]):'Like music: pp is a whisper, ff is the loudest part.'}</p>
${t.f.map((f,i)=>`<label class="lbl">${esc(f)}</label><textarea rows="2" oninput="stX2(${i},this.value)">${esc((b.x||[])[i]||'')}</textarea>`).join('')}
${b.type==='choice'?`<button onclick="stToPaths()">🌿 ${b.path&&p.paths&&pnode(p.paths,b.path)?'Open this choice in Paths':'Map this choice in Paths'}</button>`:''}
<label class="lbl">Who is in it</label>${C.length?tg('chars',C):''}<div class="row small"><input id="qnc" placeholder="New character…"><button onclick="quickNode('character','qnc','chars')">＋ Add</button></div>
${b.type==='talk'?`${inC.map(c=>`<label class="lbl">What does ${esc(c.label)} want from this talk?</label><input value="${esc((b.w||{})[c.id]||'')}" placeholder="Their goal in this conversation" oninput="stWant('${c.id}',this.value)">`).join('')||'<p class="hint">Pick who is talking to set what each one wants from it.</p>'}
<label class="lbl">Are their goals lined up?</label><select onchange="stSet('align',this.value)">${opts(CONV_ALIGN,b.align)}</select>
<label class="lbl">What is this conversation for?</label><select onchange="stSet('purpose',this.value)">${opts(CONV_PURPOSE,b.purpose)}</select>`:''}
<label class="lbl">Themes it carries</label>${T.length?tg('themes',T):''}<div class="row small"><input id="qnt" placeholder="New theme… (freedom, sacrifice)"><button onclick="quickNode('theme','qnt','themes')">＋ Add</button></div>
${F.lines.length>1?`<label class="lbl">Crosses into another story</label>${tg('meets',F.lines.filter(l=>l.id!==b.line))}<label class="lbl">Sits on</label><select onchange="stSet('line',this.value,1)">${F.lines.map(l=>`<option value="${l.id}" ${l.id===b.line?'selected':''}>${esc(l.name)}</option>`).join('')}</select>`:''}
${earlier.length?`<label class="lbl">Pays off an earlier moment</label><select onchange="stSet('pays',this.value,1)"><option value="">— no —</option>${earlier.map(x=>`<option value="${x.id}" ${x.id===b.pays?'selected':''}>${x.col+1}. ${esc(trim(x.title||(BEAT_TYPES[x.type]||{}).n,26))}</option>`).join('')}</select>`:''}
${b.type==='talk'?`<button class="claude" onclick="askClaude('Does this talk earn its place?','Look at the conversation called &quot;'+stBeat().title+'&quot; on my story staff. Tell me in plain words: what each person wants in it, whether it does a job for the story, and one way it could quietly set up something later. Then ask me 2 questions.')">✨ Does this talk earn its place?</button>`:''}
<div class="row"><button class="primary" onclick="STB=null;render()">Done</button><button class="danger" onclick="stDelBeat()">🗑 Delete</button></div></section>`}
function linesCard(F){return `<section class="card"><h2>Story lines</h2><p class="hint">One line per story: the main arc, a side character's life, the enemy's plan. Some lines only touch the main one once.</p>
${F.lines.map(l=>`<div class="grow" style="margin-top:8px"><button class="sw2" style="background:${l.color}" onclick="stLineColor('${l.id}')" aria-label="Change color"></button><input value="${esc(l.name)}" oninput="stLineName('${l.id}',this.value)" onchange="render()"><button class="x" onclick="stDelLine('${l.id}')" aria-label="Delete line">×</button></div>`).join('')}
${F.marks.length?'<h3>Arc dividers</h3>'+F.marks.sort((a,b)=>a.col-b.col).map(m=>`<div class="grow" style="margin-top:8px"><span class="tag alt">before ${m.col+1}</span><input value="${esc(m.label)}" placeholder="Arc 2 begins…" oninput="stMarkName('${m.id}',this.value)" onchange="render()"><button class="x" onclick="stDelMark('${m.id}')" aria-label="Delete divider">×</button></div>`).join(''):''}</section>`}
function stAddLine(){const F=stf();F.lines.push({id:uid(),name:'Story '+(F.lines.length+1),color:GCOL[(F.lines.length*2+5)%GCOL.length]});save();render();toast('Line added — name it below')}
function stLineName(id,v){const l=stf().lines.find(x=>x.id===id);if(l){l.name=v;save()}}
function stLineColor(id){const l=stf().lines.find(x=>x.id===id);if(l){l.color=GCOL[(GCOL.indexOf(l.color)+1)%GCOL.length];save();render()}}
function stDelLine(id){const F=stf();if(F.lines.length<2){toast('Keep at least one line');return}const l=F.lines.find(x=>x.id===id);confirmBox('Delete "'+l.name+'" and its moments?',()=>{F.lines=F.lines.filter(x=>x.id!==id);F.beats=F.beats.filter(b=>b.line!==id);F.beats.forEach(b=>b.meets=(b.meets||[]).filter(m=>m!==id));STB=null;STSLOT=null;save();render()})}
function stAddMark(){const F=stf(),b=stBeat();const col=STSLOT?STSLOT.col:b?b.col:Math.max(0,...F.beats.map(x=>x.col+1));F.marks.push({id:uid(),col,label:''});save();render();toast('Divider added before spot '+(col+1)+' — name it below')}
function stMarkName(id,v){const m=stf().marks.find(x=>x.id===id);if(m){m.label=v;save()}}
function stDelMark(id){const F=stf();F.marks=F.marks.filter(x=>x.id!==id);save();render()}
function themeCard(p,F){const T=themesOf(p);return `<section class="card"><h2>🧵 Themes</h2><p class="hint">A theme gets strong when it comes back in different stories — the same idea, a new face each time.</p>${T.map(t=>{const B=F.beats.filter(b=>(b.themes||[]).includes(t.id)).sort((a,b)=>a.col-b.col);return `<div class="chk"><b>${esc(t.label)}</b> <span class="tag ${B.length>1?'':'warn'}">${B.length} moment${B.length===1?'':'s'}</span><div class="hint">${B.map(b=>esc(trim(b.title||BEAT_TYPES[b.type].n,22))).join(' → ')||'Not in any moment yet — tap a moment and tag it.'}</div></div>`}).join('')||'<p class="hint">No themes yet. Add one from any moment, or as a Theme bubble on the Web.</p>'}</section>`}
function stCheck(p,F){const out=[],nm=b=>'"'+trim(b.title||BEAT_TYPES[b.type].n,24)+'"',C=chars(p);
 F.beats.filter(b=>b.type==='talk'&&!b.purpose).forEach(b=>out.push('💬 Conversation '+nm(b)+' has no job yet. What is it for?'));
 F.beats.filter(b=>b.type==='plant'&&!F.beats.some(x=>x.pays===b.id)).forEach(b=>out.push('🌱 Small moment '+nm(b)+' never pays off. Link a later moment back to it.'));
 F.beats.filter(b=>b.type==='wall'&&!(b.x||[])[1]).forEach(b=>out.push('🧱 Wall '+nm(b)+': how do they get past it, and what does it cost?'));
 F.beats.filter(b=>b.type==='sac'&&!(b.x||[])[1]).forEach(b=>out.push('🕯️ Sacrifice '+nm(b)+': who is it for?'));
 C.forEach(c=>{const G=c.goals||[];if(!G.length)out.push('🎯 '+c.label+' has no goal yet.');G.filter(g=>g.text&&!g.why).forEach(g=>out.push('❓ '+c.label+' wants "'+trim(g.text,30)+'" — but why?'));
  if(G.some(g=>g.status==='secret')&&!F.beats.some(b=>b.type==='reveal'&&(b.chars||[]).includes(c.id)))out.push('🔒 '+c.label+' has a secret goal but no Reveal moment.');
  if(F.beats.length&&!F.beats.some(b=>(b.chars||[]).includes(c.id)))out.push('👤 '+c.label+' is not in any moment. Why are they in the story?')});
 if(F.lines.length>1)F.lines.forEach(l=>{const mine=F.beats.filter(b=>b.line===l.id);if(mine.length&&!mine.some(b=>(b.meets||[]).length)&&!F.beats.some(b=>(b.meets||[]).includes(l.id)))out.push('🎼 "'+l.name+'" never crosses another story. That can be fine — is it on purpose?')});
 if(F.beats.length>4&&!F.beats.some(b=>b.type==='wall'))out.push('🧱 No walls yet. What stands in the way?');
 const TS=[...F.beats].filter(b=>b.ten).sort((a,c)=>a.col-c.col);let run=0,st=0;TS.forEach(b=>{if(b.ten>=4){if(!run)st=b.col;run++;if(run===3)out.push('🔥 Three loud moments in a row from spot '+(st+1)+'. Give the reader a breath after.')}else run=0});
 if(TS.length>=5&&!TS.some(b=>b.ten>=4))out.push('🎚️ Tension never gets loud (f or ff). Where is the big moment?');
 if(TS.length>=5&&!TS.some(b=>b.ten<=2))out.push('🎚️ Tension never gets quiet. Quiet parts make the loud parts hit harder.');
 if(F.beats.length>=5&&!TS.length)out.push('🎚️ Rate the tension on a few moments to see your story\'s rhythm.');
 F.lines.forEach(l=>{const c=F.beats.filter(b=>b.line===l.id).map(b=>b.col).sort((a,z)=>a-z);for(let i=1;i<c.length;i++)if(c[i]-c[i-1]>=6){out.push('🔇 "'+l.name+'" goes quiet from spot '+(c[i-1]+1)+' to '+(c[i]+1)+'. Will the reader forget it?');break}});
 F.beats.filter(b=>b.type==='choice'&&!(b.path&&p.paths&&pnode(p.paths,b.path))).forEach(b=>out.push('🔀 Choice '+nm(b)+' is not mapped in Paths yet.'));
 F.beats.filter(b=>b.type==='flash'&&!(b.x||[])[1]).forEach(b=>out.push('⏪ Flashback '+nm(b)+': why show it right now?'));
 F.beats.filter(b=>b.type==='loss'&&!(b.x||[])[1]).forEach(b=>out.push('💔 Loss '+nm(b)+': how does it change them?'));
 if(F.beats.length>6&&!F.beats.some(b=>b.type==='ending'))out.push('🏁 No ending moment on the Staff yet.');
 return out}
function checkCard(p,F){const o=stCheck(p,F);return `<section class="card"><h2>🔎 Loose threads</h2>${o.length?o.map(x=>`<div class="chk">${esc(x)}</div>`).join(''):`<p class="hint">${F.beats.length?'✅ Nothing loose right now.':'Add some moments and characters — this list will point at what is missing.'}</p>`}</section>`}

function trailToolView(){const T=trl(),ta=(k,l,ph)=>`<label class="lbl">${l}</label><textarea rows="2" oninput="trSet('${k}',this.value)" placeholder="${esc(ph)}">${esc(T[k]||'')}</textarea>`,chk=trCheck(T);

${suspectsCard(T)}<section class="card"><h2>🔎 Trail check</h2>${chk.length?chk.map(x=>`<div class="chk">${esc(x)}</div>`).join(''):'<p class="hint">✅ The trail holds together.</p>'}</section>

function trCheck(T){const o=[],S=T.steps,has=t=>S.some(s=>s.type===t);
 if(!T.truth)o.push('🔓 Write the truth first. You cannot lay a trail to somewhere you have not picked.');
 if(!T.clock)o.push('⏳ No clock. What happens if they are too slow?');
 if(!T.solver)o.push('👤 Why this person? Make the problem theirs.');
 if(!S.length){susCheck(T,o);return o}
 if(S[0].type!=='find')o.push('💀 The trail usually opens with the discovery — the strange thing that starts it.');
 if(!has('herring')&&!has('wall'))o.push('🐟 Nothing goes wrong on the way. Add a false lead or a dead end.');
 if(!has('falsefix'))o.push('🎭 No false fix. Could they think it is solved before it really is?');
 if(!has('truth'))o.push('🔓 The trail never reaches the real answer.');else if(S[S.length-1].type!=='truth')o.push('🔓 The real answer is not the last step. Is that on purpose?');

function horToStaff(){const H=hor(),F=stf(),l={id:uid(),name:'Dread ladder',color:GCOL[6]},start=Math.max(0,...F.beats.map(b=>b.col+1));

function horText(p){const H=p.horror;if(!H||(!H.fear&&!H.normal&&!H.rule&&!H.places.length&&!H.rungs.length))return'';let t='\n== Horror ==\n';

 H.rungs.forEach((r,i)=>{t+=`${i+1}. [${RUNGS[r.type].n}] ${r.what||''}${r.knows?' | reader knows: '+r.knows:''}${r.cost?' | cost: '+r.cost:''}${r.shown?' | '+r.shown:''}\n`});return t}

let PSEL=null,PMODE='build',PW=null,PSCROLL=0,PFOUND=[];
function pth(p){p=p||cur();if(!p.paths){const r={id:uid(),type:'start',title:'Start',notes:'',opts:[],gives:[]};p.paths={root:r.id,nodes:[r],keys:[]}}return p.paths}
const pnode=(P,id)=>P.nodes.find(n=>n.id===id);
const pLab=n=>n?(PTYPES[n.type]||PTYPES.scene).i+' '+(n.title||(n.type==='ending'&&n.end&&END_KINDS[n.end.kind]?END_KINDS[n.end.kind].n+' ending':(PTYPES[n.type]||PTYPES.scene).n)):'—';
const pKey=(P,id)=>(P.keys.find(k=>k.id===id)||{}).name||'?';
function pNew(type,title){const P=pth(),n={id:uid(),type,title:title||'',notes:'',opts:[],gives:[]};if(type==='ending')n.end={kind:'',earned:'',says:''};P.nodes.push(n);return n}
function pBFS(P){const d={},order=[],q=[P.root];if(!pnode(P,P.root))return{d,order};d[P.root]=0;
 while(q.length){const id=q.shift(),n=pnode(P,id);order.push(id);(n.opts||[]).forEach(o=>{if(o.to&&d[o.to]===undefined&&pnode(P,o.to)){d[o.to]=d[id]+1;q.push(o.to)}})}return{d,order}}
const PN={W:112,H:50,GX:14,RH:96,TOP:18,P:12};
function pLayout(P){const {d,order}=pBFS(P),rows=[];order.forEach(id=>{(rows[d[id]]=rows[d[id]]||[]).push(id)});
 const loose=P.nodes.filter(n=>d[n.id]===undefined).map(n=>n.id);if(loose.length)rows.push(loose);
 const mx=Math.max(1,...rows.map(r=>r.length)),W=PN.P*2+mx*(PN.W+PN.GX)-PN.GX+60,pos={};
 rows.forEach((r,ri)=>{const w=r.length*(PN.W+PN.GX)-PN.GX,x0=(W-60-w)/2;r.forEach((id,k)=>{pos[id]={x:x0+k*(PN.W+PN.GX),y:PN.TOP+ri*PN.RH,row:ri}})});
 return{pos,rows,W,H:PN.TOP+rows.length*PN.RH,loose:loose.length?rows.length-1:-1,d}}
function pathSVG(P){const L=pLayout(P),{pos}=L;let s=`<svg id="ptree" width="${L.W}" height="${L.H}" viewBox="0 0 ${L.W} ${L.H}"><defs><marker id="parr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ink)"/></marker></defs>`;
 if(L.loose>=0)s+=`<text x="${PN.P}" y="${PN.TOP+L.loose*PN.RH-8}" class="stmlab">Not connected yet</text>`;
 P.nodes.forEach(n=>{const a=pos[n.id];if(!a)return;const grp={};(n.opts||[]).forEach(o=>{if(pos[o.to])(grp[o.to]=grp[o.to]||[]).push(o)});Object.entries(grp).forEach(([to,G])=>{const b=pos[to],lock=G.every(o=>(o.need||[]).length||(o.not||[]).length);
  const st=`stroke="var(--ink)" stroke-width="2" fill="none" ${lock?'stroke-dasharray="5 4"':''} marker-end="url(#parr)"`;let mxp,myp;
  if(b.row>a.row){const x1=a.x+PN.W/2,y1=a.y+PN.H,x2=b.x+PN.W/2,y2=b.y-2,c1=y1+30,c2=y2-30,t=.7,u=1-t;s+=`<path d="M${x1} ${y1} C${x1} ${c1} ${x2} ${c2} ${x2} ${y2}" ${st}/>`;mxp=u*u*u*x1+3*u*u*t*x1+3*u*t*t*x2+t*t*t*x2;myp=u*u*u*y1+3*u*u*t*c1+3*u*t*t*c2+t*t*t*y2}
  else{const x1=a.x+PN.W,y1=a.y+PN.H/2,x2=b.x+PN.W+2,y2=b.y+PN.H/2,bx=Math.max(x1,x2)+40;s+=`<path d="M${x1} ${y1} C${bx} ${y1} ${bx} ${y2} ${x2} ${y2}" ${st}/>`;mxp=bx-12;myp=(y1+y2)/2}
  const L2=G.map(o=>((o.need||[]).length||(o.not||[]).length?'🔒':'')+o.label).filter(x=>x).join(' / '),lab=(lock&&!L2.includes('🔒')?'🔒 ':'')+trim(L2,18);if(lab.trim())s+=`<text x="${mxp}" y="${myp+4}" class="plab">${esc(lab)}</text>`})});
 P.nodes.forEach(n=>{const a=pos[n.id];if(!a)return;const k=n.type==='ending'&&n.end&&END_KINDS[n.end.kind];
  const fill=n.type==='start'?'#93c47d':n.type==='choice'?'#ffd966':n.type==='ending'?(k?k.c:'#dddddd'):'var(--card)';
  const sub=n.type==='ending'?(k?k.i+' '+k.n:'🏁 Ending'):n.type==='choice'?`🔀 ${n.opts.length} way${n.opts.length===1?'':'s'}${n.auto?' · story picks':''}`:n.type==='start'?'🟢 Start':(n.opts.length?'':'⚠️ goes nowhere');
  s+=`<g class="pn ${n.type!=='scene'?'pc':''} ${n.id===PSEL?'sel':''}" data-id="${n.id}" transform="translate(${a.x},${a.y})"><rect width="${PN.W}" height="${PN.H}" rx="${n.type==='start'?24:8}" fill="${fill}" ${n.type==='ending'?'stroke-width="3.5"':''}/><text x="${PN.W/2}" y="21" class="pt1">${esc(trim(n.title||(n.type==='start'?'Start':'(no name)'),15))}</text><text x="${PN.W/2}" y="39" class="pt2">${esc(trim(sub,20))}</text></g>`});
 return s+'</svg>'}
VIEWS.paths=()=>{const p=cur(),P=pth(p),n=pnode(P,PSEL);
 const head=`<section class="card"><h2>🌿 Paths</h2><p class="hint">For stories that branch and games with more than one ending. Every box is a moment, a <b>🔀 choice</b> or an <b>🏁 ending</b>. Any box can split, paths can join back together, and an ending can come anywhere — even right after the start. <b>Tap a box</b> to change it.</p>
<div class="row small"><button class="${PMODE==='build'?'primary':''}" onclick="PMODE='build';render()">✏️ Build</button><button class="${PMODE==='walk'?'primary':''}" onclick="pWalkStart();render()">▶ Walk it</button></div></section>`;
 if(PMODE==='walk')return head+pWalkView(P);
 return head+`<div id="phold" class="sthold">${pathSVG(P)}</div>
<div class="row small"><button onclick="pQuick('choice')">＋ 🔀 Choice</button><button onclick="pQuick('ending')">＋ 🏁 Ending</button><button onclick="pQuick('scene')">＋ ● Moment</button></div><p class="hint">New boxes sit in "Not connected yet" until a way out points at them.</p>
${n?pPanel(P,n):''}${pEndCard(P)}${pKeysCard(P)}${pCheckCard(P)}${pShapesCard(P)}${pTipsCard()}
<button class="claude" onclick="askClaude('Where could this branch?','Look at my Paths tree: the choices, keys and endings. Suggest 2 new places it could branch, 1 ending that could happen very early, and 1 way an early choice could quietly change a late ending using a key. Then ask me 2 questions.')">✨ Where could this branch?</button>`};
after.paths=()=>{const svg=$('#ptree'),h=$('#phold');if(!svg)return;h.scrollLeft=PSCROLL;h.onscroll=()=>{PSCROLL=h.scrollLeft};
 svg.onclick=e=>{const g=e.target.closest('.pn');if(!g)return;PSEL=PSEL===g.dataset.id?null:g.dataset.id;render();setTimeout(()=>{const c=$('#ppanel');if(c)c.scrollIntoView({behavior:'smooth',block:'start'})},30)}};
function pQuick(type){const n=pNew(type);PSEL=n.id;save();render();toast('Added — point a way out at it to connect it')}
const pN=()=>pnode(pth(),PSEL);
function pSet(k,v,re){const n=pN();if(n){n[k]=v;save();if(re)render()}}
function pEnd(k,v,re){const n=pN();if(n){(n.end=n.end||{})[k]=v;save();if(re)render()}}
function pType(v){const n=pN();if(!n)return;const go2=()=>{n.type=v;if(v==='ending'){n.opts=[];n.end=n.end||{kind:'',earned:'',says:''}}save();render()};
 if(v==='ending'&&n.opts.length)confirmBox('Endings don\'t lead anywhere. Remove its '+n.opts.length+' way'+(n.opts.length===1?'':'s')+' out?',go2);else go2()}
function pOptAdd(to){const n=pN();if(!n)return;n.opts.push({id:uid(),label:'',to:to||'',need:[],not:[],gives:[]});save();render()}
function pAddNew(type){const n=pN();if(!n)return;const m=pNew(type);n.opts.push({id:uid(),label:'',to:m.id,need:[],not:[],gives:[]});if(n.type==='scene'&&n.opts.length>1)n.type='choice';save();render();toast(type==='ending'?'Ending added below this one':'Added — tap it on the tree to fill it in')}
const pOpt=oid=>{const n=pN();return n&&n.opts.find(o=>o.id===oid)};
function pOptSet(oid,k,v){const o=pOpt(oid);if(o){o[k]=v;save()}}
function pOptTo(oid,v){const o=pOpt(oid);if(!o)return;if(v.startsWith('new:')){const m=pNew(v.slice(4));o.to=m.id;toast('Added — tap it on the tree to fill it in')}else o.to=v;save();render()}
function pOptTog(oid,k,kid){const o=pOpt(oid);if(!o)return;const a=o[k]=o[k]||[],i=a.indexOf(kid);i<0?a.push(kid):a.splice(i,1);save();render()}
function pOptDel(oid){const n=pN();if(!n)return;n.opts=n.opts.filter(o=>o.id!==oid);save();render()}
function pOptMove(oid,d){const n=pN();if(!n)return;const i=n.opts.findIndex(o=>o.id===oid),j=i+d;if(i<0||j<0||j>=n.opts.length)return;[n.opts[i],n.opts[j]]=[n.opts[j],n.opts[i]];save();render()}
function pGiveTog(kid){const n=pN();if(!n)return;const a=n.gives=n.gives||[],i=a.indexOf(kid);i<0?a.push(kid):a.splice(i,1);save();render()}
function pDel(){const P=pth(),n=pN();if(!n||n.id===P.root)return;confirmBox('Delete "'+(n.title||PTYPES[n.type].n)+'"? Ways that pointed at it will go nowhere.',()=>{P.nodes=P.nodes.filter(x=>x.id!==n.id);P.nodes.forEach(x=>x.opts.forEach(o=>{if(o.to===n.id)o.to=''}));(cur().staff&&cur().staff.beats||[]).forEach(b=>{if(b.path===n.id)b.path=''});PSEL=null;save();render()})}
function pPanel(P,n){const isRoot=n.id===P.root,K=P.keys,others=P.nodes.filter(x=>x.id!==n.id);
 const chips=(o,k)=>`<div class="tgl">${K.map(x=>`<button class="chip ${(o[k]||[]).includes(x.id)?'on':''}" onclick="pOptTog('${o.id}','${k}','${x.id}')">${esc(trim(x.name||'(key)',18))}</button>`).join('')}</div>`;
 const optRow=(o,i)=>{const lock=(o.need||[]).length||(o.not||[]).length||(o.gives||[]).length;return `<div class="goal" style="border-left-color:${o.to?'#93c47d':'#e06666'}"><div class="grow"><b class="beatn">${i+1}</b><input style="margin-top:0" value="${esc(o.label)}" placeholder="${n.type==='choice'?'What do they choose?':'(just carries on)'}" oninput="pOptSet('${o.id}','label',this.value)" onchange="render()"><button class="x" onclick="pOptMove('${o.id}',-1)" aria-label="Move up">↑</button><button class="x" style="margin-left:0" onclick="pOptDel('${o.id}')" aria-label="Remove">×</button></div>
<select onchange="pOptTo('${o.id}',this.value)"><option value="">→ goes to… (pick one)</option>${others.map(x=>`<option value="${x.id}" ${x.id===o.to?'selected':''}>→ ${esc(trim(pLab(x),34))}</option>`).join('')}<option value="new:scene">＋ new moment</option><option value="new:choice">＋ new choice</option><option value="new:ending">＋ new ending</option></select>
${K.length?`<details class="cbd" ${lock?'open':''}><summary>🔑 Locks &amp; keys</summary><label class="lbl">🔒 Only open if they have</label>${chips(o,'need')}<label class="lbl">🚫 Closed if they have</label>${chips(o,'not')}<label class="lbl">🎁 Taking it gives</label>${chips(o,'gives')}</details>`:''}</div>`};
 const E=n.end||{};
 return `<section class="card qcard" id="ppanel"><div class="row small">${isRoot?'<b class="beatn">🟢 Start</b>':`<select onchange="pType(this.value)">${['scene','choice','ending'].map(t=>`<option value="${t}" ${t===n.type?'selected':''}>${PTYPES[t].i} ${PTYPES[t].n}</option>`).join('')}</select>`}</div>
<label class="lbl">Name it</label><input value="${esc(n.title)}" placeholder="${n.type==='ending'?'The ending\'s name':'Short name'}" oninput="pSet('title',this.value)" onchange="render()">
<label class="lbl">What happens</label><textarea rows="3" oninput="pSet('notes',this.value)" placeholder="${isRoot?'Where and how does it begin?':'What does the reader see here?'}">${esc(n.notes)}</textarea>
${n.type==='ending'?`<label class="lbl">What kind of ending?</label><select onchange="pEnd('kind',this.value,1)"><option value="">—</option>${Object.entries(END_KINDS).map(([k,v])=>`<option value="${k}" ${k===E.kind?'selected':''}>${v.i} ${v.n}</option>`).join('')}</select>${E.kind?`<p class="hint">${esc(END_KINDS[E.kind].d)}</p>`:''}
<label class="lbl">How do they earn it?</label><textarea rows="2" oninput="pEnd('earned',this.value)" placeholder="What did they do, or not do, to get here?">${esc(E.earned||'')}</textarea>
<label class="lbl">What does it say about your theme?</label><textarea rows="2" oninput="pEnd('says',this.value)" placeholder="Freedom costs everything? Kindness gets noticed?">${esc(E.says||'')}</textarea>
<label class="lbl">How should they feel at the end?</label><input value="${esc(E.feel||'')}" placeholder="Relief, dread, laughing, hollow…" oninput="pEnd('feel',this.value)">`:''}
${n.type==='choice'?`<label class="lbl">Who picks?</label><select onchange="pSet('auto',this.value==='1',1)"><option value="0" ${n.auto?'':'selected'}>The reader / player picks</option><option value="1" ${n.auto?'selected':''}>The story picks — first way that is open (checks keys)</option></select>${n.auto?'<p class="hint">Put the hardest-to-get way first and an always-open way last. That is how a hidden-score ending gate works.</p>':''}`:''}
${K.length?`<label class="lbl">🎁 Reaching here gives</label><div class="tgl">${K.map(x=>`<button class="chip ${(n.gives||[]).includes(x.id)?'on':''}" onclick="pGiveTog('${x.id}')">${esc(trim(x.name||'(key)',18))}</button>`).join('')}</div>`:''}
${n.type!=='ending'?`<h3>Ways out</h3>${n.opts.map(optRow).join('')||'<p class="hint">Nothing leads out yet. Add a way, or make it an ending.</p>'}
<div class="row small"><button onclick="pAddNew('scene')">＋ Branch off here</button><button onclick="pAddNew('ending')">🏁 Add an ending here</button>${others.length?'<button onclick="pOptAdd()">↪ Join another path</button>':''}</div>${isRoot&&!n.opts.some(o=>{const m=pnode(P,o.to);return m&&m.type==='ending'})?'<p class="hint">💡 Want an ending right at the start? Tap 🏁 Add an ending here.</p>':''}`:''}
<div class="row"><button class="primary" onclick="PSEL=null;render()">Done</button>${isRoot?'':'<button class="danger" onclick="pDel()">🗑 Delete</button>'}</div></section>`}
function pCount(P,target){let c=0;const seen=new Set();const dfs=id=>{if(c>999)return;if(id===target){c++;return}const n=pnode(P,id);if(!n||seen.has(id))return;seen.add(id);n.opts.forEach(o=>{if(o.to)dfs(o.to)});seen.delete(id)};dfs(P.root);return c}
function pEndCard(P){const {d}=pBFS(P),E=P.nodes.filter(n=>n.type==='ending').sort((a,b)=>(d[a.id]??99)-(d[b.id]??99));

 const mix={};E.forEach(e=>{const k=(e.end||{}).kind||'';mix[k]=(mix[k]||0)+1});

${E.map(e=>{const k=END_KINDS[(e.end||{}).kind],dd=d[e.id],pc=dd===undefined?0:pCount(P,e.id);return `<div class="chk" onclick="PSEL='${e.id}';render()" style="cursor:pointer"><b>${k?k.i:'🏁'} ${esc(e.title||'(no name)')}</b> <span class="tag ${dd===undefined?'warn':''}">${dd===undefined?'not reachable':dd+' step'+(dd===1?'':'s')+' in · '+(pc>999?'1000+':pc)+' way'+(pc===1?'':'s')+' to get here'}</span>${(e.end||{}).earned?`<div class="hint">${esc(trim(e.end.earned,90))}</div>`:''}</div>`}).join('')}</section>`}
function pKeysCard(P){const used=(id,k)=>P.nodes.reduce((s,n)=>s+(k==='gives'?(n.gives||[]).includes(id)?1:0:0)+n.opts.filter(o=>(o[k]||[]).includes(id)).length,0);
 return `<section class="card"><h2>🔑 Keys</h2><p class="hint">Things the player did, knows or carries — "Spared the dog", "Knows the password", "Saw the ritual". A way out can need a key. That is how an early choice changes a late ending.</p>
${P.keys.map(k=>`<div class="goal" style="border-left-color:#f1c232"><div class="grow"><input style="margin-top:0" value="${esc(k.name)}" placeholder="Key name" oninput="pKeySet('${k.id}','name',this.value)" onchange="render()"><button class="x" onclick="pKeyDel('${k.id}')" aria-label="Delete key">×</button></div><input value="${esc(k.how||'')}" placeholder="How do they get it? Does the player know?" oninput="pKeySet('${k.id}','how',this.value)"><div class="hint">🎁 given in ${used(k.id,'gives')} place${used(k.id,'gives')===1?'':'s'} · 🔒 needed in ${used(k.id,'need')+used(k.id,'not')}</div></div>`).join('')}
<button onclick="pKeyAdd()">＋ Add a key</button></section>`}

 E.forEach(e=>{if(!(e.end||{}).kind)o.push('🏁 '+nm(e)+': what kind of ending is it?');else if(!(e.end||{}).earned)o.push('🏁 '+nm(e)+': how do they earn it?')});
 P.keys.forEach(k=>{const g=P.nodes.some(n=>(n.gives||[]).includes(k.id)||n.opts.some(x=>(x.gives||[]).includes(k.id))),u=P.nodes.some(n=>n.opts.some(x=>(x.need||[]).includes(k.id)||(x.not||[]).includes(k.id)));

 if(E.length>=2){const ks=new Set(E.map(e=>(e.end||{}).kind).filter(x=>x));if(ks.size===1)o.push('🎨 All your endings are '+END_KINDS[[...ks][0]].n+'. Mix in a different flavor?')}

function miniTree(sp){const N={},rows=[],d={s:0},q=['s'];sp.n.forEach(x=>N[x[0]]={t:x[1],k:x[3]});

 Object.keys(d).sort((a,b)=>d[a]-d[b]).forEach(id=>(rows[d[id]]=rows[d[id]]||[]).push(id));
 const bw=20,bh=13,gx=8,rh=24,mx=Math.max(...rows.map(r=>r.length)),W=mx*(bw+gx)+40,H=rows.length*rh+4,pos={};
 rows.forEach((r,ri)=>{const w=r.length*(bw+gx)-gx;r.forEach((id,k)=>pos[id]={x:(W-40-w)/2+k*(bw+gx),y:4+ri*rh})});

 sp.e.forEach(e=>{const a=pos[e[0]],b=pos[e[1]];if(!a||!b)return;const lk=e[3]&&((e[3].need||[]).length||(e[3].not||[]).length);
  if(b.y>a.y)s+=`<line x1="${a.x+bw/2}" y1="${a.y+bh}" x2="${b.x+bw/2}" y2="${b.y}" stroke="var(--ink)" stroke-width="1.5" ${lk?'stroke-dasharray="3 2"':''}/>`;
  else s+=`<path d="M${a.x+bw} ${a.y+bh/2} C${a.x+bw+22} ${a.y} ${b.x+bw+22} ${b.y} ${b.x+bw} ${b.y+bh/2}" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`});
 Object.entries(pos).forEach(([id,a])=>{const n=N[id],f=n.t==='start'?'#93c47d':n.t==='choice'?'#ffd966':n.t==='ending'?(END_KINDS[n.k]||{}).c||'#ddd':'var(--card)';s+=`<rect x="${a.x}" y="${a.y}" width="${bw}" height="${bh}" rx="${n.t==='start'?6:2}" fill="${f}" stroke="var(--ink)" stroke-width="1.3"/>`});

function pWalkStart(keep){const P=pth();PMODE='walk';const keys=keep&&PW?PW.keys.slice():[];PW={at:P.root,keys,hist:[],steps:0};pEnter(pnode(P,P.root))}
function pEnter(n){if(!n)return;(n.gives||[]).forEach(k=>{if(!PW.keys.includes(k))PW.keys.push(k)});if(n.type==='ending'&&!PFOUND.includes(n.id))PFOUND.push(n.id)}
const pOpen=o=>(o.need||[]).every(k=>PW.keys.includes(k))&&!(o.not||[]).some(k=>PW.keys.includes(k));
function pTake(oid){const P=pth(),n=pnode(P,PW.at),o=n&&n.opts.find(x=>x.id===oid);if(!o||!o.to||!pOpen(o))return;PW.hist.push({at:PW.at,keys:PW.keys.slice()});(o.gives||[]).forEach(k=>{if(!PW.keys.includes(k))PW.keys.push(k)});PW.at=o.to;PW.steps++;pEnter(pnode(P,o.to));render();window.scrollTo(0,0)}
function pBack(){const h=PW.hist.pop();if(h){PW.at=h.at;PW.keys=h.keys;PW.steps--;render()}}
function pWalkView(P){if(!PW||!pnode(P,PW.at))pWalkStart();const n=pnode(P,PW.at),E=P.nodes.filter(x=>x.type==='ending'),k=n.type==='ending'&&END_KINDS[(n.end||{}).kind];
 const keys=PW.keys.length?`<div class="tgl">${PW.keys.map(id=>`<span class="tag">🔑 ${esc(pKey(P,id))}</span>`).join('')}</div>`:'';
 let body;
 if(n.type==='ending')body=`<div class="walkend" style="border-color:${k?k.c:'var(--line)'}"><div class="beatn">${k?k.i+' '+k.n+' ending':'🏁 The end'}</div>${n.end&&n.end.earned?`<p class="hint">Earned by: ${esc(n.end.earned)}</p>`:''}${n.end&&n.end.says?`<p class="hint">It says: ${esc(n.end.says)}</p>`:''}</div>
<div class="row"><button class="primary" onclick="pWalkStart();render()">⟲ Start over</button>${P.keys.length?'<button onclick="pWalkStart(1);render()">🔁 Start over, keep keys</button>':''}</div>`;
 else if(!n.opts.length)body=`<p class="hint">⚠️ Dead end — this goes nowhere yet.</p><button onclick="PMODE='build';PSEL='${n.id}';render()">✏️ Fix it</button>`;
 else if(n.auto){const o=n.opts.find(x=>x.to&&pOpen(x));body=o?`<p class="hint">🤫 The story checks your keys…</p><button class="primary" onclick="pTake('${o.id}')">→ ${esc(o.label||pLab(pnode(P,o.to)))}</button>`:'<p class="hint">⚠️ No way is open with the keys you have. Add an always-open way last.</p>'}
 else body=`<div class="walkopts">${n.opts.map(o=>{const op=pOpen(o),why=[(o.need||[]).filter(k=>!PW.keys.includes(k)).map(k=>'needs '+pKey(P,k)).join(', '),(o.not||[]).filter(k=>PW.keys.includes(k)).map(k=>'closed: you have '+pKey(P,k)).join(', ')].filter(x=>x).join(' · ');
  return `<button ${op&&o.to?'':'disabled'} onclick="pTake('${o.id}')">${n.type==='choice'?'':'→ '}${esc(o.label||(n.opts.length>1||n.type==='choice'?pLab(pnode(P,o.to)):'Continue'))}${!o.to?' <small>(goes nowhere yet)</small>':!op?` <small>🔒 ${esc(why)}</small>`:''}</button>`}).join('')}</div>`;
 return `<section class="card walk"><div class="hint">Step ${PW.steps+1} · Endings found ${PFOUND.filter(id=>pnode(P,id)).length}/${E.length}</div><h2>${esc(pLab(n))}</h2>${n.notes?`<p class="walktxt">${esc(n.notes)}</p>`:''}${keys}${body}
<div class="row small">${PW.hist.length?'<button onclick="pBack()">↩ Back a step</button>':''}<button onclick="PMODE='build';PSEL=PW.at;render()">✏️ Edit this box</button></div></section>`}
function pathsText(p){const P=p.paths;if(!P||P.nodes.length<2)return'';const {order,d}=pBFS(P),kn=a=>(a||[]).map(k=>pKey(P,k)).join(', ');let t='\n== Paths (branches & endings) ==\n';

VIEWS.goals=()=>{const p=cur(),G=gtl(p),C=chars(p);
 return `<section class="card"><h2>🎯 Goal tree</h2><p class="hint">Put a <b>goal</b> on top, the characters who share it under it, and each one's <b>method</b> below — how they try to get it. Two characters with the same goal and different methods are <b>foils</b>: same end, different means. That clash is a story.</p>
<div class="row small"><button class="primary" onclick="gtAdd()">＋ Goal</button>${C.some(c=>(c.goals||[]).some(g=>g.text))?'<button onclick="gtPull()">⬇ Pull goals from character boxes</button>':''}</div>
<details class="cbd"><summary>See an example (Attack on Titan)</summary>${gtExample(GT_EX2)}<p class="hint">Three people chase freedom. It means something different to each one.</p>${gtExample(GT_EX)}<p class="hint">Same goal. Opposite methods. Neither one can let the other win.</p></details></section>
${C.length?'':noChars('The Goal tree')}
${G.map(g=>{const M=g.m.filter(m=>charById(p,m.c)),rest=C.filter(c=>!M.some(m=>m.c===c.id)),hows=M.map(m=>(m.how||'').trim().toLowerCase()).filter(x=>x);
 const note=M.length>=2?(hows.length>=2&&new Set(hows).size>1?'⚔️ Same end, different means. Which scene makes these methods collide?':hows.length<M.length?'❓ Fill in each method. Do they agree on HOW — or only on WHAT?':'🤝 Same goal, same method. What could split them?'):M.length===1?'👤 Only one character wants this. Who else does — or who wants the opposite?':'';
 return `<section class="card"><div class="grow"><button class="sw2" style="background:${g.color}" onclick="gtColor('${g.id}')" aria-label="Change color"></button><input value="${esc(g.text)}" placeholder="The goal (Freedom, Protect the village…)" oninput="gtSet('${g.id}','text',this.value)" onchange="render()"><button class="x" onclick="gtDel('${g.id}')" aria-label="Delete goal">×</button></div>
${gtTree(g.text,M.map(m=>{const c=charById(p,m.c);return `<div class="gtcol"><button class="x" onclick="gtRem('${g.id}','${m.c}')" aria-label="Remove">×</button>${tok(c,44)}<div class="gtname">${esc(trim(c.label,14))}</div><textarea rows="3" placeholder="How? Their method…" oninput="gtHow('${g.id}','${m.c}',this.value)" onchange="render()">${esc(m.how||'')}</textarea></div>`}))}
${note?`<p class="hint">${note}</p>`:''}
${rest.length?`<label class="lbl">Add who shares this goal</label><div class="tgl">${rest.map(c=>`<button class="chip" style="display:inline-flex;gap:6px;align-items:center" onclick="gtJoin('${g.id}','${c.id}')">${tok(c,24)} ${esc(trim(c.label,14))}</button>`).join('')}</div>`:''}
<label class="lbl">What does this goal say about your theme?</label><input value="${esc(g.note||'')}" placeholder="Freedom always costs someone else's" oninput="gtSet('${g.id}','note',this.value)"></section>`}).join('')}
${G.length?`<button class="claude" onclick="askClaude('Test my goal tree','Look at my goal tree: shared goals and each character\\'s method. Tell me in plain words: 1) which two characters are the strongest foils and the scene where their methods should collide, 2) a character whose method does not fit their background, 3) one goal that is missing someone who wants the opposite. Then ask me 2 questions.')">✨ Test my goal tree</button>`:''}`};
const gtG=id=>gtl().find(g=>g.id===id);
function gtAdd(text){const G=gtl();G.unshift({id:uid(),text:text||'',note:'',color:GCOL[(G.length*2)%GCOL.length],m:[]});save();render()}
function gtSet(id,k,v){const g=gtG(id);if(g){g[k]=v;save()}}
function gtColor(id){const g=gtG(id);if(g){g.color=GCOL[(GCOL.indexOf(g.color)+1)%GCOL.length];save();render()}}
function gtDel(id){confirmBox('Delete this goal from the tree?',()=>{cur().gt=gtl().filter(g=>g.id!==id);save();render()})}
function gtJoin(id,c){const g=gtG(id);if(g&&!g.m.some(m=>m.c===c)){g.m.push({c,how:''});save();render()}}
function gtRem(id,c){const g=gtG(id);if(g){g.m=g.m.filter(m=>m.c!==c);save();render()}}
function gtHow(id,c,v){const g=gtG(id),m=g&&g.m.find(x=>x.c===c);if(m){m.how=v;save()}}
function gtPull(){const p=cur(),G=gtl(p);let n=0;chars(p).forEach(c=>(c.goals||[]).forEach(cg=>{const t=(cg.text||'').trim();if(!t)return;let g=G.find(x=>x.text.trim().toLowerCase()===t.toLowerCase());if(!g){g={id:uid(),text:t,note:'',color:cg.color||GCOL[0],m:[]};G.push(g)}if(!g.m.some(m=>m.c===c.id)){g.m.push({c:c.id,how:''});n++}}));save();render();toast(n?'Pulled in '+n+' — goals with the same words were grouped':'Nothing new to pull in')}
function goalsText(p){const G=p.gt||[];if(!G.length)return'';let t='\n== Goal tree ==\n';G.forEach(g=>{t+=`Goal: ${g.text||'(unnamed)'}${g.note?' — theme: '+g.note:''}\n`;g.m.forEach(m=>{const c=charById(p,m.c);if(c)t+=`   ${c.label}: ${m.how||'(method not set)'}\n`})});return t}

/* ---------- INTERACTION WEB (sociogram) ---------- */
let ISEL=null;
function interData(p){const C=chars(p),F=p.staff||{beats:[]},pairs={},key=(a,b)=>a<b?a+'|'+b:b+'|'+a;
 F.beats.forEach(b=>{const cs=(b.chars||[]).filter(id=>C.some(c=>c.id===id));for(let i=0;i<cs.length;i++)for(let j=i+1;j<cs.length;j++){const k=key(cs[i],cs[j]);(pairs[k]=pairs[k]||[]).push(b)}});
 const linked={};p.web.links.forEach(l=>{if(charById(p,l.a)&&charById(p,l.b))linked[key(l.a,l.b)]=l});return{C,pairs,linked,key}}
function interSVG(p,D){const C=D.C,n=C.length,W=340,H=Math.max(240,Math.min(340,120+n*26)),cx=W/2,cy=H/2,R=Math.min(cx,cy)-38,pos={};
 C.forEach((c,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;pos[c.id]=n===1?[cx,cy]:[cx+Math.cos(a)*R*1.15,cy+Math.sin(a)*R]});
 let s=`<svg id="isvg" viewBox="0 0 ${W} ${H}" style="width:100%;display:block">${CCL}`;
 Object.entries(D.linked).forEach(([k,l])=>{if(D.pairs[k])return;const [a,b]=k.split('|');s+=`<line x1="${pos[a][0]}" y1="${pos[a][1]}" x2="${pos[b][0]}" y2="${pos[b][1]}" stroke="var(--mut)" stroke-width="1.5" stroke-dasharray="2 5"/>`});
 Object.entries(D.pairs).forEach(([k,B])=>{const [a,b]=k.split('|'),on=!ISEL||a===ISEL||b===ISEL,mx=(pos[a][0]+pos[b][0])/2,my=(pos[a][1]+pos[b][1])/2;
  s+=`<line x1="${pos[a][0]}" y1="${pos[a][1]}" x2="${pos[b][0]}" y2="${pos[b][1]}" stroke="${on?'#4f9a3a':'var(--soft)'}" stroke-width="${Math.min(10,1.5+B.length*1.6)}" stroke-linecap="round" opacity="${on?.85:.5}"/>${on?`<text x="${mx}" y="${my+4}" class="tkn" style="font-size:12px">${B.length}</text>`:''}`});
 C.forEach(c=>{const [x,y]=pos[c.id];s+=tokSVG(c,x,y,19,c.id===ISEL?'sel':'')+`<text x="${x}" y="${y+32}" class="tkn">${esc(trim(c.label,12))}</text>`});
 return s+'</svg>'}
VIEWS.inter=()=>{const p=cur(),D=interData(p),C=D.C;if(!C.length)return `<section class="card"><h2>🤝 Interactions</h2></section>`+noChars('The interaction web');
 const nm=id=>(charById(p,id)||{}).label||'?',bt=b=>trim(b.title||(BEAT_TYPES[b.type]||BEAT_TYPES.scene).n,22),sel=charById(p,ISEL);
 const tagged=(p.staff?p.staff.beats:[]).filter(b=>(b.chars||[]).length).length,E=Object.entries(D.pairs).sort((a,b)=>b[1].length-a[1].length);
 const never=[];for(let i=0;i<C.length;i++)for(let j=i+1;j<C.length;j++){const k=D.key(C[i].id,C[j].id);if(!D.pairs[k])never.push([C[i],C[j],D.linked[k]])}
 return `<section class="card"><h2>🤝 Interactions</h2><p class="hint">Who shares a moment with who. It is counted from your <a onclick="go('staff')">Staff</a>: every moment where two characters are both tagged under "Who is in it" is one interaction. Thicker line = more moments together. Dotted grey = linked on the Web but never in a moment together. The proper name for this picture is a <b>sociogram</b>. <b>Tap a head</b> to follow one person.</p>
${interSVG(p,D)}${tagged?'':'<p class="hint">⚠️ No Staff moments have characters tagged yet, so there is nothing to count. Open a moment on the Staff and pick who is in it.</p>'}</section>
${sel?`<section class="card qcard"><div class="photorow">${tok(sel,48)}<b class="beatn" style="flex:1">${esc(sel.label)}</b><button style="flex:none" onclick="ISEL=null;render()">Done</button></div>
${C.filter(c=>c.id!==sel.id).map(c=>{const k=D.key(sel.id,c.id),B=(D.pairs[k]||[]).slice().sort((a,b)=>a.col-b.col),l=D.linked[k];return `<div class="chk">${tok(c,24)} <b>${esc(c.label)}</b> <span class="tag ${B.length?'':'warn'}">${B.length?B.length+' moment'+(B.length===1?'':'s'):'never meet'}</span>${l&&l.kind&&LINK_KINDS[l.kind]?` <span class="tag alt">${esc(LINK_KINDS[l.kind].n.split(' (')[0])}</span>`:''}${B.length?`<div class="hint">${B.map(b=>(b.col+1)+'. '+esc(bt(b))).join(' → ')}</div>`:''}</div>`}).join('')}</section>`:''}
<section class="card"><h2>📊 Who is together most</h2>${E.length?E.slice(0,8).map(([k,B])=>{const [a,b]=k.split('|');return `<div class="chk">${tok(charById(p,a),24)} ${tok(charById(p,b),24)} <b>${esc(nm(a))} + ${esc(nm(b))}</b> <span class="tag">${B.length}</span></div>`}).join(''):'<p class="hint">Nothing counted yet.</p>'}</section>
<section class="card"><h2>🚫 Never share a moment (${never.length})</h2><p class="hint">This can be on purpose — some characters never meet the main one. But if two people matter to each other, the reader wants to see them in the same room.</p>${never.slice(0,14).map(([a,b,l])=>`<div class="chk">${tok(a,24)} ${tok(b,24)} ${esc(a.label)} + ${esc(b.label)}${l?' <span class="tag warn">linked on the Web</span>':''}</div>`).join('')||'<p class="hint">✅ Everyone has met everyone.</p>'}${never.length>14?`<p class="hint">…and ${never.length-14} more.</p>`:''}</section>
<button class="claude" onclick="askClaude('Who should meet?','Look at which characters share Staff moments and which never do. Tell me in plain words: 1) two characters who never meet but should, and what the scene would be, 2) one pair who are together so much that one of them may not be needed, 3) one character who could stay apart from the main character on purpose and why that is stronger. Then ask me 2 questions.')">✨ Who should meet?</button>`};
after.inter=()=>{const s=$('#isvg');if(s)s.onclick=e=>{const g=e.target.closest('.tk');ISEL=g?(ISEL===g.dataset.id?null:g.dataset.id):null;render()}};
function interText(p){const D=interData(p),E=Object.entries(D.pairs);if(!E.length)return'';return '\n== Interactions (shared Staff moments) ==\n'+E.sort((a,b)=>b[1].length-a[1].length).map(([k,B])=>{const [a,b]=k.split('|');return `${charById(p,a).label} + ${charById(p,b).label}: ${B.length}`}).join('\n')+'\n'}

<path d="M78 176 C78 150 72 130 76 104 M92 176 C92 150 98 130 94 104" stroke="#7a4a21" stroke-width="5" fill="none"/><path d="M84 176 L84 110" stroke="#7a4a21" stroke-width="13"/>

VIEWS.roots=()=>{const p=cur(),C=chars(p);if(!C.length)return `<section class="card"><h2>🌳 Roots</h2></section>`+noChars('The root tree');
 const n=charById(p,RSEL)||C[0],T=n.tree||{},c=n.c||{};RSEL=n.id;
 const deep=[['Parents / who raised them',c.parents],['Background',c.from],['What shaped them',c.wound],['How they took it',c.shaped],['Under pressure',c.stress]].filter(x=>x[1]);
 const chk=[];if(T.seen&&!T.acts)chk.push('🌿 People see a result, but which action makes it?');if(T.acts&&!T.vals)chk.push('🪵 Why do they act that way? Name the value under it.');if(T.vals&&!T.bel)chk.push('🌱 What belief makes that value feel right to them?');if(T.bel&&!deep.length)chk.push('🪨 Where did that belief come from? Fill in "Where they come from" in their Web box.');if(T.bel&&T.seen&&T.acts&&T.vals)chk.push('💥 Now break it: which event in your story proves their belief wrong? That moment is their turning point.');
 return `<section class="card"><h2>🌳 Roots</h2><p class="hint">People see the fruit. The story is in the roots. What a character <b>believes</b> grows into what they <b>value</b>, then what they <b>do</b>, then what others <b>see</b>. Build it from the roots up. Show it to the reader from the fruit down.</p>${charChips(p,n.id,'rootPick')}${rootSVG(n)}</section>
<section class="card qcard"><div class="photorow">${tok(n,48)}<b class="beatn" style="flex:1">${esc(n.label)}</b></div>
${ROOT_PARTS.slice().reverse().map(r=>`<label class="lbl">${r[1]}</label><textarea rows="2" placeholder="${esc(r[2])}" oninput="rootSet('${r[0]}',this.value)" onchange="render()">${esc(T[r[0]]||'')}</textarea>`).join('')}
<h3>🪨 Deep roots</h3>${deep.length?deep.map(d=>`<div class="chk"><b>${esc(d[0])}:</b> ${esc(d[1])}</div>`).join(''):'<p class="hint">Nothing yet.</p>'}<button onclick="SEL='${n.id}';CBOPEN=true;go('web')">✏️ Edit where they come from (Web box)</button>
${chk.length?'<h3>🔎 Follow the root</h3>'+chk.map(x=>`<div class="chk">${esc(x)}</div>`).join(''):''}
<button class="claude" onclick="askClaude('Dig at the roots','Focus on the character &quot;'+charById(cur(),RSEL).label+'&quot; and their root tree (beliefs, values, actions, results) plus their background. Tell me in plain words: 1) where an action does not match the belief under it, 2) one belief that the story could prove wrong, and the scene that would do it, 3) another character who grew a different tree from the same roots. Then ask me 2 questions.')">✨ Dig at the roots</button></section>`};

function rootsText(p){let t='';chars(p).forEach(n=>{const T=n.tree;if(!T||!Object.values(T).some(x=>x))return;t+=`${n.label}: `+ROOT_PARTS.slice().reverse().filter(r=>T[r[0]]).map(r=>r[1].split(' — ')[0].replace(/^\S+\s/,'')+': '+T[r[0]]).join(' → ')+'\n'});return t?'\n== Root trees (beliefs → values → actions → results) ==\n'+t:''}

/* ---------- FAMILY TREE (genogram) ---------- */
let FSEL=null;
function fam(p){p=p||cur();return p.fam||(p.fam={links:[]})}
function famLayout(p){const L=fam(p).links.filter(l=>charById(p,l.a)&&charById(p,l.b)),ids=[];L.forEach(l=>[l.a,l.b].forEach(x=>{if(!ids.includes(x))ids.push(x)}));
 const gen={};ids.forEach(i=>gen[i]=0);for(let k=0;k<ids.length+2;k++)L.forEach(l=>{if(l.k==='partner'){const m=Math.max(gen[l.a],gen[l.b]);gen[l.a]=gen[l.b]=m}else if(gen[l.b]<gen[l.a]+1&&k<ids.length)gen[l.b]=gen[l.a]+1});
 const rows=[];ids.forEach(i=>(rows[gen[i]]=rows[gen[i]]||[]).push(i));const xi={};
 for(let r=0;r<rows.length;r++){let row=rows[r]||[];if(r>0)row=row.map((id,i)=>{const ps=L.filter(l=>l.k!=='partner'&&l.b===id).map(l=>xi[l.a]).filter(v=>v!==undefined);return[id,ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:1e6+i]}).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
  L.filter(l=>l.k==='partner').forEach(l=>{const ia=row.indexOf(l.a),ib=row.indexOf(l.b);if(ia>=0&&ib>=0&&Math.abs(ia-ib)>1){row.splice(ib,1);const i=row.indexOf(l.a),nx=row[i+1],taken=nx&&L.some(q=>q.k==='partner'&&((q.a===l.a&&q.b===nx)||(q.b===l.a&&q.a===nx)));row.splice(taken?i:i+1,0,l.b)}});
  rows[r]=row;row.forEach((id,i)=>xi[id]=i-(row.length-1)/2)}
 return{L,ids,rows:rows.map(r=>r||[]),xi,gen}}
function famSVG(p){const D=famLayout(p),GX=78,GY=104,R=22,mx=Math.max(1,...D.rows.map(r=>r.length)),W=Math.max(340,mx*GX+40),H=D.rows.length*GY+16,pos={};
 D.ids.forEach(id=>pos[id]=[W/2+D.xi[id]*GX,36+D.gen[id]*GY]);const dash=k=>k==='adopt'?'stroke-dasharray="2 6" stroke-linecap="round"':'';
 let s=`<svg id="fsvg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;margin:0 auto">${CCL}`;
 const partners=D.L.filter(l=>l.k==='partner');partners.forEach(l=>{const a=pos[l.a],b=pos[l.b];s+=`<line x1="${a[0]}" y1="${a[1]-3}" x2="${b[0]}" y2="${b[1]-3}" stroke="#c27ba0" stroke-width="3"/><line x1="${a[0]}" y1="${a[1]+3}" x2="${b[0]}" y2="${b[1]+3}" stroke="#c27ba0" stroke-width="3"/>`});
 const kids={};D.L.filter(l=>l.k!=='partner').forEach(l=>(kids[l.b]=kids[l.b]||[]).push(l));
 Object.entries(kids).forEach(([c,ls])=>{const cp=pos[c],used=new Set();
  if(ls.length>=2)for(let i=0;i<ls.length;i++)for(let j=i+1;j<ls.length;j++){const A=ls[i],B=ls[j];if(used.has(A)||used.has(B)||A.k!==B.k)continue;if(partners.some(q=>(q.a===A.a&&q.b===B.a)||(q.a===B.a&&q.b===A.a))){used.add(A);used.add(B);const x=(pos[A.a][0]+pos[B.a][0])/2,y=pos[A.a][1],my=cp[1]-R-18;s+=`<path d="M${x} ${y+4} V${my} H${cp[0]} V${cp[1]-R}" fill="none" stroke="#6fa8dc" stroke-width="3" ${dash(A.k)}/>`}}
  ls.filter(l=>!used.has(l)).forEach(l=>{const a=pos[l.a],my=cp[1]-R-18;s+=`<path d="M${a[0]} ${a[1]+R} V${my} H${cp[0]} V${cp[1]-R}" fill="none" stroke="#6fa8dc" stroke-width="3" ${dash(l.k)}/>`})});
 D.ids.forEach(id=>{const c=charById(p,id),[x,y]=pos[id];s+=tokSVG(c,x,y,R,id===FSEL?'sel':'')+`<text x="${x}" y="${y+R+14}" class="tkn">${esc(trim(c.label,11))}</text>`});
 return{svg:s+'</svg>',n:D.ids.length}}
VIEWS.family=()=>{const p=cur(),C=chars(p),F=fam(p);if(!C.length)return `<section class="card"><h2>👪 Family tree</h2></section>`+noChars('The family tree');
 const T=famSVG(p),sel=charById(p,FSEL),nm=id=>(charById(p,id)||{}).label,o=C.map(c=>`<option value="${c.id}">${esc(trim(c.label,22))}</option>`).join('');
 const L=F.links.filter(l=>charById(p,l.a)&&charById(p,l.b));
 return `<section class="card"><h2>👪 Family tree</h2><p class="hint">Who raised who. Blue solid = blood. Blue dotted = adopted or raised by. Pink double line = partners. A red ✖ = dead (or thought to be). A family tree that shows the <i>kind</i> of bond is called a <b>genogram</b>. Tap a head to mark them.</p>

function worldCheck(p){const out=[],P=nodesOf(p,'place'),F=nodesOf(p,'faction'),C=chars(p),H=p.hist||{ev:[]},G=p.grapes||{},R=p.rules||{list:[]};
 if(!P.length)out.push(['places','🏙️ No places yet. Where does the first scene happen?']);
 P.filter(n=>!(n.pl||{}).why).slice(0,3).forEach(n=>out.push(['places','🏙️ '+n.label+': why was it built here? A place with a reason feels real.']));
 if(P.length>1&&!P.some(n=>(n.pl||{}).inside))out.push(['places','🗺️ No place sits inside another yet. Put a town inside a country, so the maps can zoom later.']);
 if(F.length===1)out.push(['factions','🚩 Only one faction. Who wants the opposite of what they want?']);
 F.filter(n=>!(n.fx||{}).want).slice(0,3).forEach(n=>out.push(['factions','🚩 '+n.label+' has no goal yet. What do they want?']));
 F.filter(n=>(n.fx||{}).say&&!(n.fx||{}).truth).slice(0,2).forEach(n=>out.push(['factions','🚩 '+n.label+': you wrote what they tell everyone. What is really going on?']));
 if(H.ev.length&&!H.ev.some(e=>e.told&&e.truth&&e.told.trim()!==e.truth.trim()))out.push(['history','📜 Every event in your history is told truthfully. Which one do people get wrong, and who gains from the lie?']);
 if(H.ev.length&&!H.ev.some(e=>e.by==='nature'))out.push(['history','🌋 All of your history was made by people. What did nature do: a flood, a plague, a long winter?']);
 if(H.ev.length&&!H.ev.some(e=>e.now))out.push(['history','📍 Mark one event as "the story starts here" so you know what is past and what is still to come.']);
 const gm=GRAPES.filter(g=>!(G[g[0]]||'').trim());if(gm.length&&gm.length<6)out.push(['grapes','🍇 G.R.A.P.E.S. is missing: '+gm.map(g=>g[2]).join(', ')+'.']);
 if(R.list&&R.list.some(r=>r.rule&&!r.cost))out.push(['rules','✨ A world rule has no cost or limit yet.']);
 const nh=C.filter(c=>!(c.file||{}).home);if(C.length&&P.length&&nh.length)out.push(['files','🗂️ '+nh.length+' character'+(nh.length>1?'s have':' has')+' no home place yet.']);
 const W=wld(p);if(!W.affect.trim())out.push(['world','❓ Answer the first big question above: how does this world change the story?']);
 return out}

let PLSEL=null;
const plKind=n=>PLACE_KINDS.find(k=>k[0]===((n.pl||{}).kind))||null;
function plTree(p){const P=nodesOf(p,'place'),ids=new Set(P.map(n=>n.id)),out=[],seen=new Set();
 const walk=(n,d)=>{if(seen.has(n.id))return;seen.add(n.id);out.push([n,d]);P.filter(c=>(c.pl||{}).inside===n.id).forEach(c=>walk(c,d+1))};
 P.filter(n=>!(n.pl||{}).inside||!ids.has(n.pl.inside)).forEach(n=>walk(n,0));P.forEach(n=>walk(n,0));return out}
function plSet(k,v,re){const n=nodeById(cur(),PLSEL);if(!n)return;(n.pl=n.pl||{})[k]=v;if(k==='inside'){let x=n,g=0;while(x&&(x.pl||{}).inside&&g++<30){x=nodeById(cur(),x.pl.inside);if(x&&x.id===n.id){n.pl.inside='';toast('A place cannot sit inside itself');break}}}save();if(re)render()}

function plDel(){const p=cur(),n=nodeById(p,PLSEL);if(!n)return;confirmBox('Delete the place "'+n.label+'"? It also leaves the Web.',()=>{p.web.nodes=p.web.nodes.filter(x=>x.id!==n.id);p.web.links=p.web.links.filter(l=>l.a!==n.id&&l.b!==n.id);p.web.nodes.forEach(x=>{if(x.pl&&x.pl.inside===n.id)x.pl.inside='';if(x.file&&x.file.home===n.id)x.file.home='';if(x.fx&&x.fx.base===n.id)x.fx.base=''});PLSEL=null;save();render()})}

${n?`<section class="card qcard"><div class="grow"><input value="${esc(n.label)}" oninput="plName(this.value)" onchange="render()" style="font-family:var(--hand);font-size:22px"><button class="x2" onclick="PLSEL=null;render()" aria-label="Close">×</button></div>
<label class="lbl">What kind of place?</label><select onchange="plSet('kind',this.value,1)"><option value="">—</option>${selOpts(PLACE_KINDS,pl.kind)}</select>${k?`<p class="hint">${ZOOM[k[2]]}</p>`:''}
<label class="lbl">It sits inside</label><select onchange="plSet('inside',this.value,1)">${nodeOpts(nodesOf(p,'place').filter(x=>x.id!==n.id),pl.inside,'— nothing (top of the map) —')}</select>
${CITY_Q.map(q=>`<label class="lbl">${q[1]}</label><textarea rows="2" placeholder="${esc(q[2])}" oninput="plSet('${q[0]}',this.value)">${esc(pl[q[0]]||'')}</textarea>`).join('')}

<button onclick="nwAdd()">＋ Add news</button>

function worldText(p){let t='';const W=p.wo||{},A=p.wq||{},G=p.grapes||{},H=p.hist,N=p.news||[];
 if(W.one||W.affect||W.change){t+='\n== World ==\n';if(W.one)t+=`In one sentence: ${W.one}\n`;if(W.affect)t+=`How the world changes the story: ${W.affect}\n`;if(W.change)t+=`How the world itself changes: ${W.change}\n`}
 WQ.forEach(part=>{const Q=part.q.filter(q=>(A[q[0]]||'').trim());if(Q.length){t+=`\n== World questions: ${part.n} ==\n`;Q.forEach(q=>t+=`Q: ${q[1]}\nA: ${A[q[0]]}\n`)}});
 if(GRAPES.some(g=>(G[g[0]]||'').trim())){t+=`\n== G.R.A.P.E.S.${G.who?' ('+G.who+')':''} ==\n`;GRAPES.forEach(g=>{if((G[g[0]]||'').trim())t+=`${g[2]}: ${G[g[0]]}\n`})}
 const P=nodesOf(p,'place').filter(n=>n.pl&&Object.values(n.pl).some(x=>x));if(P.length){t+='\n== Places ==\n';plTree(p).forEach(([n,d])=>{const pl=n.pl||{},k=plKind(n);t+=`${'  '.repeat(d)}${n.label}${k?' ['+k[1]+']':''}\n`;CITY_Q.forEach(q=>{if(pl[q[0]])t+=`${'  '.repeat(d)}  ${q[1]} ${pl[q[0]]}\n`})})}
 const F=nodesOf(p,'faction').filter(n=>n.fx&&Object.keys(n.fx).length);if(F.length){t+='\n== Factions ==\n';F.forEach(n=>{const fx=n.fx,L=charById(p,fx.leader),B=nodeById(p,fx.base),M=chars(p).filter(c=>(c.file||{}).faction===n.id);t+=`${n.label}${L?' (leader: '+L.label+')':''}${B?' (base: '+B.label+')':''}\n`;FACTION_Q.forEach(q=>{if(fx[q[0]])t+=`  ${q[1].replace(/\?.*$/,'')}: ${fx[q[0]]}\n`});if(M.length)t+=`  Members: ${M.map(c=>c.label).join(', ')}\n`;(fx.rel||[]).forEach(r=>{const o=nodeById(p,r.to),k=FREL.find(z=>z[0]===r.kind);if(o&&k)t+=`  ${k[1].replace(/^\S+\s/,'')}: ${o.label}\n`})})}
 if(H&&(H.ev.length||Object.values(H.cal).some(x=>x))){t+='\n== History ==\n';CAL_Q.forEach(q=>{if(H.cal[q[0]])t+=`${q[1]} ${H.cal[q[0]]}\n`});H.ev.forEach((e,i)=>{t+=`${i+1}. ${e.when?'['+e.when+'] ':''}${e.title||'Untitled'} (${e.by==='nature'?'nature':'people'}; ${(HIST_KEPT.find(k=>k[0]===e.kept)||['',''])[1].replace(/^\S+\s/,'')})${e.now?' <-- STORY STARTS HERE':''}\n`;if(e.truth)t+=`   Truth: ${e.truth}\n`;if(hGap(e))t+=`   People say: ${e.told}${e.teller?' (told by: '+e.teller+')':''}\n`})}
 const C=chars(p).filter(c=>c.file&&Object.values(c.file).some(x=>x));if(C.length){t+='\n== Character files ==\n';C.forEach(c=>{const f=c.file,fa=nodeById(p,f.faction),h=nodeById(p,f.home);t+=`${c.label}: ${[f.status,fa&&'faction '+fa.label,h&&'home '+h.label,f.faith&&'faith '+f.faith,f.job].filter(x=>x).join('; ')}\n`})}
 if(N.some(n=>n.head)){t+='\n== In-world news ==\n';N.forEach(n=>{if(n.head)t+=`- ${n.when?'['+n.when+'] ':''}${n.head}${n.src?' (from: '+n.src+')':''}${n.truth?' — really: '+n.truth:''}\n`})}
 return t}

/* ---------- HIDDEN DEPTHS (People) ---------- */
let DSEL=null,DOPEN=null;
const dps=n=>n.depths||(n.depths=[]);
function dChar(){return charById(cur(),DSEL)}
function dCur(){const n=dChar();return n&&dps(n).find(d=>d.id===DOPEN)}
function dPick(id){DSEL=id;DOPEN=null;render()}
function dAdd(){const n=dChar();if(!n)return;const d={id:uid(),wound:'',kind:'object',carrier:'',first:'',reps:['',''],payoff:'',pay:'revealed',real:'',know:'none'};dps(n).push(d);DOPEN=d.id;save();render()}
function dSet(k,v,re){const d=dCur();if(d){d[k]=v;save();if(re)render()}}
function dRep(i,v){const d=dCur();if(d){d.reps[i]=v;save()}}
function dRepAdd(){const d=dCur();if(d){d.reps.push('');save();render()}}
function dRepDel(i){const d=dCur();if(d){d.reps.splice(i,1);save();render()}}
function dDel(){const n=dChar();confirmBox('Delete this hidden depth?',()=>{n.depths=dps(n).filter(d=>d.id!==DOPEN);DOPEN=null;save();render()})}
function dCheck(d){const out=[],reps=d.reps.filter(x=>x.trim());
 if(!d.wound.trim())out.push('🧊 Start with the wound or the question. Without it the object is only an object.');
 if(d.wound.trim()&&!d.carrier.trim())out.push('🧣 Pick the carrier: one small thing that can hold all of that without a word.');
 if(d.first.trim()&&/\b(because|explains?|tells? (him|her|them|us)|says? (it|that) (is|was))\b/i.test(d.first))out.push('🤫 The first showing sounds like it explains itself. Cut the reason. Let it look like nothing.');
 if(d.carrier.trim()&&!d.first.trim())out.push('👀 Where does the reader first see it? Make it early, and make it small.');
 if(d.first.trim()&&reps.length<2)out.push('🔁 Show it at least two more times before the payoff. Three showings is the least that feels like a pattern.');
 if(reps.length>=2&&new Set(reps.map(x=>x.trim().toLowerCase())).size<reps.length)out.push('🔁 Two repeats are the same. Change one thing each time: who sees it, where, or how they treat it.');
 if(reps.length&&!d.payoff.trim())out.push('💥 It has no payoff yet. What happens to it in the scene that matters most?');
 if(d.payoff.trim()&&!d.real.trim())out.push('💡 Finish the sentence: "When you finally realize that…"');
 if(d.real.trim()&&d.wound.trim()&&d.real.trim().toLowerCase()===d.wound.trim().toLowerCase())out.push('💡 The realization only repeats the wound. Say what the reader sees differently now about the earlier scenes.');
 if(d.payoff.trim()&&d.know==='none')out.push('🎭 Who knows what? Pick it below. A reader who knows more than the character feels dread. A reader who knows less feels shock.');
 if(d.payoff.trim()&&d.real.trim()&&reps.length>=2)out.push('📖 Second-read test: go back to the first showing. Does it hurt now that you know? If yes, it works.');
 if(d.payoff.trim())out.push('🤐 Can the payoff land with no dialogue at all? If a look or the object can do it alone, cut the words.');
 return out}
function dToStaff(){const n=dChar(),d=dCur();if(!n||!d)return;if(!d.first.trim()||!d.payoff.trim()){toast('Fill in the first showing and the payoff first');return}
 const F=stf(),line=F.lines[0],reps=d.reps.filter(x=>x.trim()),start=Math.max(0,...F.beats.map(b=>b.col+1)),nm=d.carrier.trim()||'Hidden depth';
 confirmBox('Add '+(2+reps.length)+' moments for "'+trim(nm,24)+'" to the Staff? They go at the end of the first line. Move them where they belong after.',()=>{
  const mk=(type,title,notes,col,pays)=>{const b={id:uid(),line:line.id,col,type,title:trim(title,30),notes,chars:[n.id],themes:[],meets:[],pays:pays||'',x:[],w:{}};F.beats.push(b);return b};
  const a=mk('plant',nm+': first shown',d.first,start);reps.forEach((r,i)=>mk('plant',nm+': repeat '+(i+1),r,start+1+i,''));
  const pay=mk('reveal',nm+': payoff',d.payoff+(d.real?'\nThe reader realizes: '+d.real:''),start+1+reps.length,a.id);pay.x=[d.wound,d.first];
  save();STB=pay.id;STSLOT=null;go('staff');toast('Plant, repeats and payoff are on the Staff')})}
VIEWS.depths=()=>{const p=cur(),C=chars(p);if(!C.length)return `<section class="card"><h2>🧊 Hidden depths</h2></section>`+noChars('Hidden depths');
 const n=charById(p,DSEL)||C[0];DSEL=n.id;const D=dps(n),d=D.find(x=>x.id===DOPEN),c=n.c||{},chk=d?dCheck(d):[];

 return `<section class="card"><h2>🧊 Hidden depths</h2><p class="hint">The moments that make a reader say "wait… <b>that</b> is why". You build them backwards: start from the hurt, hide it inside one small thing, show that thing with no explanation, repeat it quietly, then let it pay off.</p>${charChips(p,n.id,'dPick')}</section>

let ANOPEN=null;
function anatHas(p,a){const an=p.anat||{},C=chars(p);const filled=(an[a.k]||[]).some(x=>x&&x.trim());
 switch(a.k){case'premise':return filled||!!(p.logline||'').trim();
 case'core3':return filled||C.some(c=>(c.goals||[]).some(g=>(g.text||'').trim()));
 case'theme':return filled||nodesOf(p,'theme').length>0;
 case'structure':return Object.values(beatsOf(p)||{}).filter(x=>x).length>=3||(p.spine||[]).filter(x=>x).length>=4;
 case'pacing':return filled||!!(p.staff&&p.staff.beats.some(b=>b.ten));
 case'ending':return !!(p.ending||'').trim();
 case'setup':return C.some(c=>(c.depths||[]).length)||!!(p.staff&&p.staff.beats.some(b=>b.pays));
 case'tone':return filled||!!(p.horror&&(p.horror.places||[]).length);
 case'world':return nodesOf(p,'place').length>0||!!((p.wo||{}).one||'').trim();
 case'rules':return !!(p.rules&&(p.rules.list||[]).length);
 case'draft':return ((p.draft||{}).pieces||[]).some(x=>wc(x)>=100);
 case'revise':return (p.revise||[]).filter(x=>x).length>=6;
 default:return filled}}
function anatScore(p){const h=ANAT.filter(a=>anatHas(p,a)).length;return{have:h,all:ANAT.length}}

 return `<section class="card"><h2>🫀 Story anatomy</h2><p class="hint">Every part that goes into a story, taken apart. <b>Green</b> = you have it. <b>Grey</b> = still empty. Tap a part to work on it. You have <b>${sc.have} of ${sc.all}</b>.</p><div class="meter"><i style="width:${Math.round(sc.have/sc.all*100)}%"></i></div>

 p.snow={s1:'A girl searching for her missing brother finds her town has been drowning one person a year to stay afloat.',
  p5:['Mira keeps the bell with her grandmother in Saltmarrow, a town on stilts over a rising sea.','The bell rings by itself and her brother Teo vanishes, leaving only a boot tied with a red cord.','Mira trusts the smuggler Dace, who says he sold Teo passage out — a lie that wastes the time she has left.','In Grandma\'s room she finds a red cord for every missing person; the newest has her own name — Teo took her place.','On Offering Night Mira rings the bell backwards, ending the bargain: Teo comes back, the tide comes in, and the town must climb uphill.'],
  p4:['Saltmarrow: creaking stilts, fog, and a bell that only Mira and Ostra may touch. Mira wants out; Teo wants her safe. Ostra ties a new knot on her wrist and says nothing.','The bell rings at midnight. Everyone stays inside. In the morning Teo\'s bed is empty and his boot is found at the edge of the pier, tied with red cord. The Council says he ran away.','Mira searches the docks. Dace swears he sold Teo passage to the mainland. She spends days chasing boats that never carried him. The Council records about missing people have been burned.','In Ostra\'s room, a box of red cords — each tag a name, each name a missing person. Her mother\'s name. Then, newest of all, her own name, crossed out, and Teo\'s written over it.','Offering Night. Ostra begs her to let it be. Mira climbs the tower and rings the bell backwards. The bell cracks. The sea gives Teo back, and the tide begins to rise. The town climbs the hill. Ostra unties her last knot.'],
