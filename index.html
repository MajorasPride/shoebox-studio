<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shoebox Studio · Cut, Paste, Play</title>
<style>
:root{--ink:#3b2f2a;--kraft:#e7d3a8;--paper:#fbf6ea;--red:#d9463e;--blue:#3767bb;--green:#63b35d;--yellow:#f5d142}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#6b4a34;color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;font-weight:700;overscroll-behavior:none}
#cv{position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
#top{position:fixed;left:0;right:0;top:0;height:46px;display:flex;align-items:center;gap:6px;padding:0 8px;z-index:5;pointer-events:none}
#top>*{pointer-events:auto}
#ttl{flex:1;font-size:17px;font-weight:900;letter-spacing:.3px;color:#fff;text-shadow:0 1px 0 #0006,0 0 8px #0005;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.tb{min-width:42px;height:38px;border-radius:10px;background:var(--paper);box-shadow:0 2px 0 #0004;font-size:19px;position:relative;padding:0 6px}
.tb:active{transform:translateY(2px);box-shadow:none}
.tb b{position:absolute;right:-3px;top:-4px;background:var(--red);color:#fff;font-size:11px;min-width:17px;height:17px;border-radius:9px;line-height:17px;padding:0 4px}
.scr{display:none}
.scr.on{display:block}
/* home */
#home{position:fixed;left:0;right:0;bottom:0;top:38%;padding:6px 16px 10px;overflow:auto;z-index:3}
#homeCards{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:560px;margin:0 auto}
.card{position:relative;text-align:left;padding:16px 12px 12px;border-radius:4px;box-shadow:0 3px 0 #0003,0 6px 14px #0004;min-height:118px;display:flex;flex-direction:column;gap:2px}
.card::before{content:"";position:absolute;left:50%;top:-9px;width:56px;height:18px;margin-left:-28px;background:#f3e6b8cc;transform:rotate(-3deg);box-shadow:0 1px 1px #0002}
.card .em{font-size:30px;line-height:1.1}
.card b{font-size:19px;font-weight:900}
.card i{font-style:normal;font-size:12.5px;font-weight:600;opacity:.85;line-height:1.25}
.card:active{transform:scale(.97)}
.c1{background:#f5d142;transform:rotate(-1.2deg)}
.c2{background:#62b6e8;transform:rotate(1deg)}
.c3{background:#8fd08a;transform:rotate(.8deg)}
.c4{background:#f191b3;transform:rotate(-.8deg)}
#ver{text-align:center;color:#fff;opacity:.8;font-size:12px;margin-top:16px;font-weight:600;text-shadow:0 1px 0 #0006}

#lobbyUI{position:fixed;left:0;right:0;bottom:0;z-index:4;pointer-events:none;padding:0 10px calc(14px + env(safe-area-inset-bottom));display:none;flex-direction:column;align-items:center;gap:10px}
#lobbyUI.on{display:flex}
#lobbyUI button{pointer-events:auto;height:46px;padding:0 18px;border-radius:23px;font-weight:900;font-size:15px;box-shadow:0 3px 0 #0005}
#lobGo{background:var(--yellow);display:none}
#ovl{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;background:#3e2a1e}
#ovl.on{display:flex}
#ovlBar{flex:none;display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:#caa76c;border-bottom:3px solid #8b5a3c;box-shadow:0 2px 6px #0005;z-index:1}
#ovlBack{height:38px;padding:0 15px;border-radius:19px;background:var(--yellow);font-weight:900;font-size:14.5px;box-shadow:0 3px 0 #0005;white-space:nowrap}
#ovlTtl{flex:1;min-width:0;font-weight:900;font-size:14px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ovlOut{flex:none;width:34px;height:34px;border-radius:17px;background:var(--paper);display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);font-size:16px;box-shadow:0 2px 0 #0004}
#ovlBox{flex:1;min-height:0;position:relative;background:#2b2140}
#ovlBox iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
#lobQuick{background:var(--paper)}#lobRow{display:flex;gap:8px;align-self:stretch;justify-content:space-between;pointer-events:none}#lobMove{background:var(--paper)}#lobMove.on{background:var(--yellow)}
#classUI{position:fixed;left:0;right:0;top:46px;bottom:0;overflow:auto;padding:8px 12px 40px;z-index:3}
#classIn{max-width:560px;margin:0 auto}
.cnote{color:#fff;font-size:13px;font-weight:700;text-shadow:0 1px 0 #0006;margin:4px 2px 10px;line-height:1.35}
.branch{background:#2f6b4f;border:6px solid #8b5a3c;border-radius:8px;padding:10px 10px 12px;margin-bottom:14px;color:#fff}
.branch h3{margin:0 0 2px;font-size:18px;font-weight:900}
.branch p{margin:0 0 8px;font-size:12.5px;font-weight:600;opacity:.9}
.les{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--paper);color:var(--ink);border-radius:8px;padding:9px 10px;margin-top:7px;font-size:14px;font-weight:800;box-shadow:0 2px 0 #0005}
.les i{font-style:normal;margin-left:auto;font-size:16px}
.les small{display:block;font-size:11.5px;font-weight:600;opacity:.75}
.soonb{display:flex;flex-wrap:wrap;gap:6px}
.soonb span{background:#ffffff26;border:1.5px dashed #ffffff88;border-radius:14px;padding:5px 10px;font-size:12px;font-weight:700}
#lesson{position:fixed;left:8px;right:8px;top:50px;z-index:6;background:#2f6b4f;border:5px solid #8b5a3c;border-radius:8px;color:#fff;padding:7px 9px 6px;display:none;box-shadow:0 4px 10px #0006}
#lesson.on{display:block}
#lesT{font-size:12px;font-weight:800;opacity:.85}
#lesS{font-size:14.5px;font-weight:700;line-height:1.3;margin:3px 0 6px;min-height:38px}
#lesB{display:flex;align-items:center;gap:6px}
#lesB button{height:34px;min-width:44px;padding:0 10px;border-radius:17px;background:var(--paper);color:var(--ink);font-weight:900;font-size:14px}
#lesB #lesX{background:var(--yellow);padding:0 16px}
#lesN{font-size:12px;font-weight:800;flex:1;text-align:center}
#lesPill{position:fixed;left:8px;top:52px;z-index:6;display:none;height:34px;padding:0 12px;border-radius:17px;background:#2f6b4f;border:3px solid #8b5a3c;color:#fff;font-weight:900;font-size:13px}
#lesPill.on{display:block}
/* craft */
#craftUI{position:fixed;left:0;right:0;bottom:0;z-index:4;pointer-events:none}
#craftUI>*{pointer-events:auto}
#hint{margin:0 auto 6px;width:max-content;max-width:92%;background:#fffbe9ee;border-radius:12px;padding:5px 12px;font-size:12.5px;font-weight:700;box-shadow:0 1px 0 #0003;text-align:center;pointer-events:none!important}
#chips{display:flex;gap:7px;overflow-x:auto;padding:6px 8px;background:#5a3d2bdd;scrollbar-width:none;min-height:66px;align-items:center}
#chips::-webkit-scrollbar,#tray::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-width:58px;height:54px;border-radius:9px;background:var(--paper);box-shadow:0 2px 0 #0005;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px 7px;font-size:21px;line-height:1}
.chip small{font-size:10.5px;font-weight:800;white-space:nowrap}
.chip svg{width:40px;height:20px;display:block}
.chip.on{background:var(--yellow);outline:3px solid #fff;outline-offset:-1px}
.chip:active{transform:translateY(2px);box-shadow:none}
.chip.sw{min-width:44px;width:44px;height:50px;border-radius:3px;outline:2px solid #0002;outline-offset:-2px}
.chip.sw.on{outline:4px solid #fff}
#tabs{display:flex;background:#3e2a1e;padding:4px 4px calc(4px + env(safe-area-inset-bottom));gap:3px}
.tab{flex:1;height:50px;border-radius:9px 9px 3px 3px;color:#f6ead0;font-size:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.tab small{font-size:10px;font-weight:800}
.tab.on{background:#5a3d2b;color:#fff;box-shadow:inset 0 3px 0 var(--yellow)}
/* stage */
#stageUI{position:fixed;left:0;right:0;bottom:0;z-index:4;pointer-events:none}
#stageUI>*{pointer-events:auto}
#itemBar{display:none;gap:6px;justify-content:center;padding:0 6px 6px;flex-wrap:wrap;pointer-events:none!important}
#itemBar.on{display:flex}
#itemBar button{pointer-events:auto;min-width:42px;height:40px;padding:0 9px;border-radius:10px;background:var(--paper);box-shadow:0 2px 0 #0005;font-size:16px;font-weight:800}
#stageBtns{display:flex;gap:8px;padding:0 8px 6px;justify-content:space-between;pointer-events:none!important}
#stageBtns button{pointer-events:auto;height:42px;padding:0 14px;border-radius:21px;background:var(--yellow);box-shadow:0 3px 0 #0005;font-size:15px;font-weight:900}
#stageBtns button.alt{background:var(--paper)}
#tray{display:flex;gap:7px;overflow-x:auto;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:#3e2a1eee;scrollbar-width:none;min-height:86px;align-items:center}
.tit{flex:0 0 auto;width:66px;height:70px;border-radius:9px;background:var(--paper);box-shadow:0 2px 0 #0005;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;overflow:hidden;padding:2px}
.tit canvas{width:48px;height:48px}
.tit span{max-width:60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tit.on{background:var(--yellow);outline:3px solid #fff}
#trayEmpty{color:#f6ead0;font-size:13px;padding:0 8px;font-weight:700}
/* play */
#playUI{position:fixed;inset:0;z-index:4;pointer-events:none}
#playUI button{pointer-events:auto;position:absolute;width:74px;height:74px;border-radius:50%;background:#fffbe9cc;box-shadow:0 3px 0 #0005;font-size:30px;font-weight:900;touch-action:none}
#playUI button.dn{background:var(--yellow);transform:translateY(2px);box-shadow:none}
#pL{left:14px;bottom:calc(22px + env(safe-area-inset-bottom))}
#pR{left:100px;bottom:calc(22px + env(safe-area-inset-bottom))}
#pJ{right:16px;bottom:calc(22px + env(safe-area-inset-bottom))}
#playUI #pStop{width:auto;height:40px;border-radius:20px;padding:0 14px;font-size:14px;right:8px;top:52px;background:var(--paper)}
#hud{position:absolute;left:10px;top:54px;background:#fffbe9dd;border-radius:14px;padding:5px 12px;font-size:14px;font-weight:900}
/* toy box */
#boxUI{position:fixed;left:0;right:0;top:46px;bottom:0;overflow:auto;padding:10px 12px 30px;z-index:3}
#boxGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px;max-width:640px;margin:0 auto}
.toy{background:var(--paper);border-radius:6px;box-shadow:0 3px 0 #0004;padding:6px;display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:800;gap:3px}
.toy canvas{width:84px;height:84px}
.toy span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#boxNote{color:#fff;text-align:center;font-size:13px;font-weight:700;margin:4px auto 12px;max-width:520px;text-shadow:0 1px 0 #0006}
/* dialog + toast */
#dlg{position:fixed;inset:0;background:#0007;z-index:20;display:none;align-items:center;justify-content:center;padding:16px}
#dlg.on{display:flex}
#dlgIn{background:var(--paper);border-radius:8px;padding:16px;width:100%;max-width:360px;max-height:88vh;overflow:auto;box-shadow:0 8px 30px #0008;font-size:14px;font-weight:700}
#dlgIn h2{margin:0 0 10px;font-size:19px;font-weight:900}
#dlgIn p{margin:6px 0;font-weight:600;line-height:1.35}
#dlgIn .row{display:flex;align-items:center;gap:10px;margin:10px 0}
#dlgIn .row label{flex:0 0 118px}
#dlgIn input[type=range]{flex:1;height:30px;accent-color:var(--red)}
#dlgIn input[type=text]{width:100%;font:inherit;padding:9px 10px;border-radius:8px;border:2px solid #cdb98a;background:#fff;user-select:text;-webkit-user-select:text}
#dlgIn .btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
#dlgIn .btns button{flex:1;min-width:110px;height:44px;border-radius:22px;background:var(--yellow);box-shadow:0 3px 0 #0004;font-weight:900;font-size:14px}
#dlgIn .btns button.alt{background:#e9dfc6}
#dlgIn .btns button.bad{background:#f2a7a0}
#dlgIn canvas.pv{display:block;margin:0 auto 8px;width:150px;height:150px;background:repeating-conic-gradient(#efe6cf 0 25%,#f8f1e0 0 50%) 0 0/20px 20px;border-radius:6px}
.tog{width:58px;height:32px;border-radius:16px;background:#cbbf9f;position:relative;flex:0 0 auto}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0005;transition:left .15s}
.tog.on{background:var(--green)}
.tog.on::after{left:29px}
.hsw{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.hsw.on{border-color:var(--ink)}
#toast{position:fixed;left:50%;top:58px;transform:translateX(-50%);background:#3b2f2aee;color:#fff;padding:8px 14px;border-radius:16px;font-size:13.5px;font-weight:800;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
/* asset library (inside the toy box) */
#boxIn{max-width:640px;margin:0 auto}
#boxTools{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
#boxQ{width:100%;height:46px;font:inherit;font-size:15px;padding:0 14px;border-radius:23px;border:2px solid #cdb98a;background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text}
#boxTypes,#boxAct{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#boxTypes::-webkit-scrollbar{display:none}
#boxTypes button,#boxAct button{flex:0 0 auto;height:44px;padding:0 13px;border-radius:22px;background:var(--paper);box-shadow:0 2px 0 #0005;font-size:13.5px;font-weight:900;white-space:nowrap}
#boxTypes button.on{background:var(--yellow);outline:3px solid #fff;outline-offset:-1px}
#boxAct button{flex:1}
.toy small{font-size:10.5px;font-weight:700;opacity:.72;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dlgIn label.lb{display:block;font-size:12.5px;margin:10px 0 4px}
#dlgIn select,#dlgIn textarea{width:100%;font:inherit;padding:9px 10px;border-radius:8px;border:2px solid #cdb98a;background:#fff;color:var(--ink);min-height:44px}
#dlgIn textarea{height:110px;font-size:11px;font-family:ui-monospace,monospace;font-weight:400;user-select:text;-webkit-user-select:text}
/* pixel ui kit */
#kitUI{position:fixed;left:0;right:0;top:46px;bottom:0;overflow:auto;padding:6px 12px 40px;z-index:3}
#kitIn{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:9px}
.krow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.krow.sc{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:2px 1px 4px}
.krow.sc::-webkit-scrollbar{display:none}
.kb{flex:0 0 auto;min-width:44px;height:44px;padding:0 12px;border-radius:12px;background:var(--paper);box-shadow:0 2px 0 #0005;font-size:13.5px;font-weight:900;white-space:nowrap;position:relative;display:flex;align-items:center;justify-content:center;gap:4px}
.kb.on{background:var(--yellow);outline:3px solid #fff;outline-offset:-1px}
.kb.big{flex:1;height:50px;border-radius:25px;background:var(--yellow);font-size:15px}
.kb.big.alt{background:var(--paper)}
.kb input[type=color]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.kcap{color:#fff;font-size:12.5px;font-weight:800;text-shadow:0 1px 0 #0006;margin:2px 2px -4px}
#kitPv{display:block;width:100%;height:132px;border-radius:10px;background:#241a2e;box-shadow:inset 0 0 0 3px #0005}
#kitGrid{display:block;margin:0 auto;touch-action:none;border-radius:4px;box-shadow:0 3px 0 #0005;background:#fff}
.ksw{flex:0 0 auto;width:44px;height:44px;border-radius:10px;box-shadow:0 2px 0 #0005;border:3px solid #0000}
.ksw.on{border-color:#fff;outline:3px solid var(--ink)}
.kcard{background:var(--paper);border-radius:10px;padding:6px 12px;box-shadow:0 3px 0 #0004}
.kcard .row{display:flex;align-items:center;gap:10px;min-height:48px}
.kcard .row label{flex:0 0 104px;font-size:13.5px}
.kcard input[type=range]{flex:1;min-width:0;height:34px;accent-color:var(--red)}
.kcard input[type=color]{width:60px;height:44px;border:0;padding:0;background:none}
.kcard input[type=text]{flex:1;min-width:0;height:44px;font:inherit;padding:0 10px;border-radius:8px;border:2px solid #cdb98a;background:#fff;color:var(--ink);text-transform:uppercase;user-select:text;-webkit-user-select:text}
.kcard .tog{width:66px;height:44px;border-radius:22px}
.kcard .tog::after{width:36px;height:36px;top:4px;left:4px}
.kcard .tog.on::after{left:26px}
.kcard output{min-width:34px;text-align:right;font-size:13.5px}
.knote{color:#fff;font-size:12px;font-weight:700;opacity:.85;text-shadow:0 1px 0 #0006;text-align:center}
/* make a level: mode switch + layer switch */
#lvlBar{position:fixed;left:0;right:0;top:48px;z-index:4;display:none;justify-content:space-between;gap:6px;padding:0 8px;pointer-events:none;flex-wrap:wrap}
#lvlBar.on{display:flex}
.seg{display:flex;pointer-events:auto;background:#3e2a1ecc;border-radius:24px;padding:3px;gap:3px}
.seg button{height:44px;min-width:44px;padding:0 12px;border-radius:22px;color:#fbf6ea;font-size:13px;font-weight:900;white-space:nowrap}
.seg button.on{background:var(--yellow);color:var(--ink)}
.seg button.lock{opacity:.8;outline:1.5px dashed #fbf6ea99;outline-offset:-4px}
.seg button small{font-size:10px;font-weight:800;opacity:.85}
/* v1.6a */
#bClock b{background:var(--blue)}
#stageBtns button{padding:0 11px;white-space:nowrap;font-size:14px}
#ovl.on~#dlg{z-index:40}
#ovlSave{flex:none;height:34px;padding:0 10px;border-radius:17px;background:var(--paper);font-weight:900;font-size:13px;box-shadow:0 2px 0 #0004;white-space:nowrap}
#proj{position:fixed;inset:0;z-index:35;display:none;background:#17110c}
#proj.on{display:block}
#projCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#projBar{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;padding:calc(6px + env(safe-area-inset-top)) 8px 6px}
#projBack,#projAgain{flex:none;height:38px;padding:0 15px;border-radius:19px;background:var(--yellow);font-weight:900;font-size:14.5px;box-shadow:0 3px 0 #0005;white-space:nowrap}
#projAgain{background:var(--paper)}
#projTtl{flex:1;min-width:0;color:#fbf6ea;font-weight:900;font-size:14px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px;max-height:176px;overflow:auto;padding:5px;background:#efe6cf;border-radius:8px}
.fbGrid button{background:var(--paper);border-radius:6px;padding:3px;box-shadow:0 1px 0 #0003;position:relative;font-size:10px;font-weight:800;line-height:1.1;overflow:hidden}
.fbGrid button span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbGrid canvas{width:52px;height:52px;display:block;margin:0 auto}
.fbGrid i{position:absolute;left:2px;top:2px;font-style:normal;background:var(--red);color:#fff;border-radius:8px;min-width:16px;font-size:10px;line-height:16px;text-align:center}
/* v1.6b: art box, paper stock, toy box medium row, Handy Notebook */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px;max-height:44vh;overflow:auto;padding:2px}
.mbtn{background:var(--paper);border-radius:8px;padding:4px 4px 5px;box-shadow:0 2px 0 #0004;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800}
.mbtn canvas{width:100%;height:34px;border-radius:5px}.mbtn.on{outline:3px solid var(--blue)}
.mcols{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.mcol{width:32px;height:32px;border-radius:50%;box-shadow:0 2px 0 #0004,inset 0 0 0 2px #0002}.mcol.on{outline:3px solid var(--blue);outline-offset:2px}
.les.on{outline:3px solid var(--blue)}
#boxMed{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center;padding-bottom:2px}#boxMed::-webkit-scrollbar{display:none}#boxMed b{color:#fff;font-size:12px;flex:0 0 auto}
#boxMed button{flex:0 0 auto;height:36px;padding:0 11px;border-radius:18px;background:var(--paper);box-shadow:0 2px 0 #0005;font-size:12.5px;font-weight:900;white-space:nowrap}#boxMed button.on{background:var(--yellow)}

  const f=document.createElement('iframe');f.title=t.name;f.setAttribute('allow','autoplay; fullscreen; clipboard-write');f.src=t.src;$('#ovlBox').append(f);$('#ovl').classList.add('on');$('#lobGo').style.display='none';setVol();
  try{history.pushState({sbsTool:id},'')}catch(e){}}
function closeTool(fromBack){if(!OVL)return;if(OVL==='proj'){projClose(fromBack);return}if(OVL==='r3d'){if(R3&&R3.isOpen())R3.close();else OVL=null;if(!fromBack){try{if(history.state&&history.state.sbsTool)history.back()}catch(e){}}return}OVL=null;$('#ovl').classList.remove('on');$('#ovlBox').innerHTML='';setVol();RM.near=undefined;try{SFX.tick()}catch(e){}
  if(!fromBack){try{if(history.state&&history.state.sbsTool)history.back()}catch(e){}}}

const SET=Object.assign({music:true,mv:.5,sv:.8,hand:1},LS.get('settings',{}));
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* ---- matrices: [a,b,c,d,e,f] like canvas ---- */
const I=[1,0,0,1,0,0];
const mul=(m,n)=>[m[0]*n[0]+m[2]*n[1],m[1]*n[0]+m[3]*n[1],m[0]*n[2]+m[2]*n[3],m[1]*n[2]+m[3]*n[3],m[0]*n[4]+m[2]*n[5]+m[4],m[1]*n[4]+m[3]*n[5]+m[5]];
const inv=m=>{const d=m[0]*m[3]-m[1]*m[2];return[m[3]/d,-m[1]/d,-m[2]/d,m[0]/d,(m[2]*m[5]-m[3]*m[4])/d,(m[1]*m[4]-m[0]*m[5])/d]};
const ap=(m,p)=>({x:m[0]*p.x+m[2]*p.y+m[4],y:m[1]*p.x+m[3]*p.y+m[5]});
function reflM(P,d){const a=2*d.x*d.x-1,b=2*d.x*d.y,dd=2*d.y*d.y-1;return[a,b,b,dd,P.x-(a*P.x+b*P.y),P.y-(b*P.x+dd*P.y)]}
/* ---- canvas helpers ---- */
function mkCanvas(w,h,rf){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));c._x=c.getContext('2d',rf?{willReadFrequently:true}:undefined);return c}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function polyPath(c,p){c.beginPath();for(let i=0;i<p.length;i++)i?c.lineTo(p[i].x,p[i].y):c.moveTo(p[i].x,p[i].y);c.closePath()}
function inPoly(p,poly){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a.y>p.y)!==(b.y>p.y)&&p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x)ins=!ins}return ins}
function polyArea(p){let s=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];s+=a.x*b.y-b.x*a.y}return s/2}
function distSeg(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy||1,f=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/l2,0,1);return{d:Math.hypot(p.x-a.x-dx*f,p.y-a.y-dy*f),f}}
function alphaAt(c,x,y){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=c.width||y>=c.height)return 0;return c._x.getImageData(x,y,1,1).data[3]}
/* polylines (for rulers and stencils) */
function plPrep(pts,closed){const n=pts.length,seg=closed?n:n-1,cum=[0];for(let i=0;i<seg;i++){const a=pts[i],b=pts[(i+1)%n];cum.push(cum[i]+Math.hypot(b.x-a.x,b.y-a.y))}return{pts,closed,cum,len:cum[seg],seg}}
function plAt(pl,t){if(pl.closed)t=((t%pl.len)+pl.len)%pl.len;else t=clamp(t,0,pl.len);let i=0;while(i<pl.seg-1&&pl.cum[i+1]<t)i++;const a=pl.pts[i],b=pl.pts[(i+1)%pl.pts.length],L=pl.cum[i+1]-pl.cum[i]||1,f=(t-pl.cum[i])/L;return{x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f}}
function plProj(pl,p,near){let best=null;for(let i=0;i<pl.seg;i++){const a=pl.pts[i],b=pl.pts[(i+1)%pl.pts.length],r=distSeg(p,a,b),t=pl.cum[i]+r.f*(pl.cum[i+1]-pl.cum[i]);if(near!=null){let dt=Math.abs(t-near);if(pl.closed)dt=Math.min(dt,pl.len-dt);if(dt>90)continue}if(!best||r.d<best.d)best={d:r.d,t}}return best}
function plPath(pl,t0,t1){let d=t1-t0;if(pl.closed){if(d>pl.len/2)d-=pl.len;else if(d<-pl.len/2)d+=pl.len}const n=Math.max(1,Math.ceil(Math.abs(d)/1.5)),out=[];for(let i=0;i<=n;i++)out.push(plAt(pl,t0+d*i/n));return out}
/* ---- textures made in code ---- */
const TEX=(()=>{const c=mkCanvas(160,160),x=c._x;for(let i=0;i<3200;i++){x.fillStyle=Math.random()<.5?'rgba(255,255,255,'+rnd(.02,.11)+')':'rgba(0,0,0,'+rnd(.02,.08)+')';x.fillRect(rnd(160),rnd(160),rnd(1,3),1)}for(let i=0;i<150;i++){x.strokeStyle='rgba(255,255,255,'+rnd(.03,.09)+')';x.lineWidth=.7;const px=rnd(160),py=rnd(160),a=rnd(TAU);x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.cos(a)*rnd(3,9),py+Math.sin(a)*rnd(3,9));x.stroke()}return c})();
const WOOD=(()=>{const c=mkCanvas(256,256),x=c._x;x.fillStyle='#c99a62';x.fillRect(0,0,256,256);for(let i=0;i<90;i++){const y=rnd(256),k=1+Math.floor(rnd(3)),ph=rnd(TAU),am=rnd(1,5);x.strokeStyle=Math.random()<.6?'rgba(120,72,30,'+rnd(.05,.2)+')':'rgba(255,225,170,'+rnd(.05,.16)+')';x.lineWidth=rnd(.6,2.4);x.beginPath();for(let px=0;px<=256;px+=8){const yy=y+Math.sin(px/256*TAU*k+ph)*am;px?x.lineTo(px,yy):x.moveTo(px,yy)}x.stroke()}return c})();

const PAPERS=['#d9463e','#f08a2e','#f5d142','#63b35d','#2f7d4f','#62b6e8','#3767bb','#8b5cb6','#f191b3','#8b5a3c','#3b3b40','#f6f2e9','#caa76c'];

/* ================= SOUND (all made in code) ================= */
const AU={c:null,rubT:0};
function auInit(){if(AU.c){if(AU.c.state==='suspended')AU.c.resume();return}const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const c=AU.c=new AC();AU.sfx=c.createGain();AU.mus=c.createGain();const cp=c.createDynamicsCompressor();AU.sfx.connect(cp);AU.mus.connect(cp);cp.connect(c.destination);
  const b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.nb=b;

function nz(o){const c=AU.c;if(!c)return;const t=c.currentTime+(o.at||0),s=c.createBufferSource();s.buffer=AU.nb;const f=c.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f||2000,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+o.d);f.Q.value=o.q||1;const gn=c.createGain();gn.gain.setValueAtTime(.0001,t);gn.gain.linearRampToValueAtTime(o.g||.4,t+(o.a||.004));gn.gain.exponentialRampToValueAtTime(.0001,t+o.d);s.connect(f);f.connect(gn);gn.connect(AU.sfx);s.start(t,Math.random()*1.5);s.stop(t+o.d+.05)}
function tn(o){const c=AU.c;if(!c)return;const t=c.currentTime+(o.at||0),s=c.createOscillator();s.type=o.type||'sine';s.frequency.setValueAtTime(o.f,t);if(o.f2)s.frequency.exponentialRampToValueAtTime(o.f2,t+o.d);const gn=c.createGain();gn.gain.setValueAtTime(.0001,t);gn.gain.linearRampToValueAtTime(o.g||.2,t+(o.a||.004));gn.gain.exponentialRampToValueAtTime(.0001,t+o.d);s.connect(gn);gn.connect(o.mus?AU.mus:AU.sfx);s.start(t);s.stop(t+o.d+.05)}
const SFX={

   CLK.m = minutes into the game day (0..1440). One game day = 8 real minutes (DAYSEC). CLK.sp = 1 normal, 2 fast, 0 paused.
   Saved as craftloft_clock. Dawn 5:00-7:00, day 7:00-17:00, dusk 17:00-19:30, night 19:30-5:00. */

function clkSave(){LS.set('clock',{m:Math.round(CLK.m*10)/10,sp:CLK.sp})}

/* ---- Flip paper: every sheet has a front and a back. p.art = the side you see, p.back = the other side, p.side = 'front' or 'back'.
   Both sides are stored in the side's own view (so the back's shape is the mirror of the front's). Turning over swaps them with a card-flip.
   The back shows a faint mirrored see-through of the front (see flatSkin). The desk save keeps both sides; toys can use either side. */
function mirDeco(d,w){const m=q=>({...q,x:w-q.x}),o={...d};if(d.pts)o.pts=d.pts.map(m);if(d.dots)o.dots=d.dots.map(m);if(d.a){o.a=m(d.a);o.b=m(d.b)}if(d.type==='pin')o.x=w-d.x;return o}
function turnOver(p){const w=p.w,h=p.h,mr=mkCanvas(w,h,true);mr._x.translate(w,0);mr._x.scale(-1,1);mr._x.drawImage(p.art,0,0);
  const nb=mkCanvas(w,h,true),x=nb._x;if(p.back&&p.back.width===w&&p.back.height===h)x.drawImage(p.back,0,0);else{x.fillStyle=p.color||'#f6f2e9';x.fillRect(0,0,w,h)}x.globalCompositeOperation='destination-in';x.drawImage(mr,0,0);x.globalCompositeOperation='source-over';
  p.back=p.art;p.art=nb;p.cow=false;p.side=p.side==='back'?'front':'back';p.creases=p.creases.map(c=>({a:{x:w-c.a.x,y:c.a.y},b:{x:w-c.b.x,y:c.b.y},type:c.type}));p.strokes=p.strokes.map(s2=>({pts:s2.pts.map(u=>({x:w-u.x,y:u.y}))}));p.deco=p.deco.map(d=>mirDeco(d,w));p.dirty=true;p.comp=null}
function actTurn(){const p=needSel();if(!p)return;if(p.layers||isBonded(p)){toast('Flip works on a flat, loose piece. Unfold or unstick it first.');return}checkpoint();const old=ensureSkin(p);turnOver(p);p.flipA={t0:NOW,old};SFX.peel();toast(p.side==='back'?'Back side. Draw on it too!':'Front side');saveDeskSoon()}
/* bake a toy from one side: pieces that show the other side are turned over for the bake, then turned back */
function bakeSide(p,name,side){const ms=plan(p).members.filter(q=>q.back&&(q.side||'front')!==side&&!q.layers&&!isBonded(q));ms.forEach(turnOver);let b;try{b=bakeToy(p,name)}finally{ms.forEach(turnOver)}return b}
function sheetOf(q){if(!q||!q.back)return null;const fr=q.side==='back'?q.back:q.art,bk=q.side==='back'?q.art:q.back;return{front:fr.toDataURL(),back:bk.toDataURL()}}
function sheetToDesk(toy){const v=C.view,a=new Image(),b=new Image();let n=2;const done=()=>{if(--n)return;const A=mkCanvas(a.width,a.height,true);A._x.drawImage(a,0,0);const B=mkCanvas(b.width,b.height,true);B._x.drawImage(b,0,0);const p=newPiece(A,v.x,v.y,0,toy.color||'#f6f2e9');p.med=medCopy(toy.med);p.back=B;p.side='front';C.pieces.push(p);C.sel=p;saveDeskSoon()};a.onload=done;b.onload=done;a.src=toy.sheet.front;b.src=toy.sheet.back}

  else if(m==='poster'){c.globalAlpha=.18;c.lineWidth=2*k;c.strokeStyle='#fff';path(-2.5*k,-2.5*k);c.stroke()}
  else if(m==='glow'){c.globalAlpha=.14;c.lineWidth=M.w*k*2.6;c.strokeStyle=col;path(0,0);c.stroke()}

function stockTex(art,sk,col,p){const x=art._x,W2=art.width,H2=art.height,R=mulberry(W2*7+H2);x.save();
  if(sk==='sketch'){for(let i=0;i<W2*H2/40;i++){x.fillStyle=R()<.5?'rgba(0,0,0,.035)':'rgba(255,255,255,.08)';x.fillRect(R()*W2,R()*H2,1,1)}}
  else if(sk==='water'){for(let i=0;i<W2*H2/140;i++){const px=R()*W2,py=R()*H2,r=2+R()*5;x.fillStyle=R()<.5?'rgba(0,0,0,.035)':'rgba(255,255,255,.12)';x.beginPath();x.arc(px,py,r,0,TAU);x.fill()}x.strokeStyle='rgba(0,0,0,.05)';x.lineWidth=3;for(let i=0;i<14;i++){x.beginPath();x.moveTo(R()*W2,0);x.lineTo(R()*W2,H2);x.stroke()}}
  else if(sk==='card'){x.strokeStyle='rgba(0,0,0,.14)';x.lineWidth=5;x.strokeRect(2.5,2.5,W2-5,H2-5);const gr=x.createLinearGradient(0,0,W2,H2);gr.addColorStop(0,'rgba(255,255,255,.16)');gr.addColorStop(.5,'rgba(255,255,255,0)');gr.addColorStop(1,'rgba(0,0,0,.06)');x.fillStyle=gr;x.fillRect(0,0,W2,H2)}
  else if(sk==='kraft'){x.globalCompositeOperation='multiply';x.fillStyle='#d2ab73';x.fillRect(0,0,W2,H2);x.globalCompositeOperation='source-over';for(let i=0;i<W2*H2/260;i++){const px=R()*W2,py=R()*H2,a=R()*TAU,l=3+R()*9;x.strokeStyle=R()<.5?'rgba(90,55,20,.22)':'rgba(255,240,210,.22)';x.lineWidth=.8;x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.cos(a)*l,py+Math.sin(a)*l);x.stroke()}}
  else if(sk==='black'){for(let i=0;i<W2*H2/60;i++){x.fillStyle='rgba(255,255,255,.04)';x.fillRect(R()*W2,R()*H2,1,1)}}
  else if(sk==='trace'){x.clearRect(0,0,W2,H2);x.fillStyle=liftCol(col,.35);x.globalAlpha=.62;x.fillRect(0,0,W2,H2);x.globalAlpha=1;x.fillStyle='rgba(255,255,255,.18)';x.fillRect(0,0,W2,H2)}
  else if(sk==='glit'){for(let i=0;i<W2*H2/55;i++){x.globalAlpha=.35+R()*.6;x.fillStyle=['#fff','#ffe9a8','#f9d5ff','#c9f1ff'][i&3];x.fillRect(R()*W2,R()*H2,1+R()*1.6,1+R()*1.6)}p.med.gl=1}
  else if(sk==='glowp'){x.fillStyle='rgba(255,255,255,.12)';x.fillRect(0,0,W2,H2);p.med.glow='#d8ffb0'}
  x.restore()}

const M3D={flat:{em:'🪧',name:'Cutout',tip:'A cardboard stand-up, like now.'},paper:{em:'📦',name:'Papercraft',tip:'Folds up out of the paper into a thick layered piece with a stand.'},clay:{em:'🫓',name:'Puffy clay',tip:'Puffs up like squishy clay, round in the middle.'}};
function m3dDlg(toy){let st=toy.m3d||'flat';const show=()=>{if(M3STOP){M3STOP();M3STOP=null}const c=$('#pv3');if(!c)return;const n=c.cloneNode();c.replaceWith(n);r3dLoad().then(m=>m.preview(n,toy,st)).then(stop=>{if($('#pv3')===n)M3STOP=stop;else stop()}).catch(()=>toast('3D could not load'))};
  dlg('<h2>🧊 Make it 3D</h2><canvas class="pv3" id="pv3"></canvas><div class="m3s">'+Object.keys(M3D).map(k=>'<button data-s="'+k+'" class="'+(k===st?'on':'')+'">'+M3D[k].em+'<br>'+M3D[k].name+'</button>').join('')+'</div><p id="m3tip" style="font-size:12.5px;margin:6px 0 0">'+M3D[st].tip+'</p><p style="font-size:12px;opacity:.75;margin:4px 0 0">You see it this way in Retro 3D. 2D stays the same.</p><div class="btns"><button class="alt" id="dNo">Cancel</button><button id="dYes">Save</button></div>',d=>{
    d.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{st=b.dataset.s;SFX.tick();d.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b));d.querySelector('#m3tip').textContent=M3D[st].tip;show()});
    d.querySelector('#dNo').onclick=closeDlg;d.querySelector('#dYes').onclick=()=>{if(st==='flat')delete toy.m3d;else toy.m3d=st;saveToys();closeDlg();SFX.thud();toast(toy.name+': '+M3D[st].name+' in Retro 3D')};setTimeout(show,30)})}

</script>
</body>
</html>
